- name: Check OHS domain type - Standalone or WebLogic domain
  become: true
  block:
    - name: Check for config.xml in domain home
      ansible.builtin.stat:
        path: "{{ ohs_domain_home }}/config/config.xml"
      register: domain_config_xml
      failed_when: false

    - name: Check for httpd.conf in domain home
      ansible.builtin.stat:
        path: "{{ ohs_domain_home }}/config/fmwconfig/components/OHS/{{ ohs_component_name }}/httpd.conf"
      register: domain_httpd_conf
      failed_when: false

    - name: Check for NodeManager process belonging to this OHS domain
      ansible.builtin.shell: |
        pgrep -a -f "[w]eblogic.NodeManager" | grep -F "{{ ohs_domain_home }}"
      register: wls_nodemanager
      changed_when: false
      failed_when: false  

    - name: Print NodeManager process details
      ansible.builtin.debug:
        msg: |
          === NodeManager Process Details ===
          {{ wls_nodemanager.stdout }}
      when: wls_nodemanager.rc == 0

    - name: Check for AdminServer process belonging to this OHS domain
      ansible.builtin.shell: |
        pgrep -a -f "[w]eblogic.Server" | grep -F "{{ ohs_domain_home }}" | grep -F "Dweblogic.Name=AdminServer"
      register: wls_adminserver
      changed_when: false
      failed_when: false

    - name: Print AdminServer process details
      ansible.builtin.debug:
        msg: |
          === AdminServer Process Details ===
          {{ wls_adminserver.stdout }}
      when: wls_adminserver.rc == 0

    - name: Check for wlserver directory under oracle home
      ansible.builtin.stat:
        path: "{{ ohs_oracle_home }}/wlserver"
      register: wlserver_dir
      failed_when: false

    - name: Check OHS httpd process
      ansible.builtin.shell: |
        ps -eo pid,ppid,args | grep "[h]ttpd" | awk '$2 == 1 {print $1, $3}'
      register: ohs_process
      changed_when: false
      failed_when: false

    - name: Print OHS httpd process details
      ansible.builtin.debug:
        msg: |
          === OHS httpd Process Details ===
          {{ ohs_process.stdout }}
      when: ohs_process.rc == 0

    - name: Print OHS httpd master process ID
      ansible.builtin.debug:
        msg: "OHS httpd master PID: {{ ohs_process.stdout.split() | first }}"
      when: ohs_process.rc == 0 and ohs_process.stdout | default('') | length > 0

    - name: Set fact for OHS process IDs
      ansible.builtin.set_fact:
        ohs_httpd_pid: >-
          {{ (ohs_process.stdout | default('')).split() | first | default('')
             if ohs_process is defined and ohs_process.rc | default(1) == 0
             else '' }}
        ohs_nodemanager_pid: >-
          {{ (wls_nodemanager.stdout | default('')).split() | first | default('')
             if wls_nodemanager is defined and wls_nodemanager.rc | default(1) == 0
             else '' }}

    - name: Print OHS process IDs
      ansible.builtin.debug:
        msg: |
          === OHS Process IDs ===
          httpd PID       : {{ ohs_httpd_pid if ohs_httpd_pid else 'NOT RUNNING' }}
          NodeManager PID : {{ ohs_nodemanager_pid if ohs_nodemanager_pid else 'NOT RUNNING' }}

    - name: Read config.xml content
      ansible.builtin.slurp:
        src: "{{ ohs_domain_home }}/config/config.xml"
      register: config_xml_content
      when: domain_config_xml.stat.exists | default(false)
      failed_when: false

    - name: Print config.xml content
      ansible.builtin.debug:
        msg: "{{ config_xml_content.content | b64decode }}"
      when: domain_config_xml.stat.exists | default(false) and config_xml_content.content is defined

    - name: Extract AdminServer listen port from config.xml
      ansible.builtin.shell: |
        python3 - <<'EOF'
        import re
        with open("{{ ohs_domain_home }}/config/config.xml") as f:
            content = f.read()
        admin_block = re.search(r'<server\b[^>]*>.*?<name>AdminServer</name>.*?</server>', content, re.DOTALL)
        if admin_block:
            port = re.search(r'<listen-port>(\d+)</listen-port>', admin_block.group())
            print(port.group(1) if port else '7001')
        else:
            print('7001')
        EOF
      register: adminserver_port
      changed_when: false
      failed_when: false
      when: domain_config_xml.stat.exists | default(false)

    - name: Extract all server stanzas from config.xml
      ansible.builtin.shell: |
        python3 - <<'EOF'
        import re
        with open("{{ ohs_domain_home }}/config/config.xml") as f:
            content = f.read()
        servers = re.findall(r'<server\b[^>]*>.*?</server>', content, re.DOTALL)
        for block in servers:
            name  = re.search(r'<name>(.*?)</name>', block)
            port  = re.search(r'<listen-port>(\d+)</listen-port>', block)
            addr  = re.search(r'<listen-address>(.*?)</listen-address>', block)
            print("--- Server Block ---")
            print("  Name         : " + (name.group(1) if name else 'N/A'))
            print("  Listen Port  : " + (port.group(1) if port else '7001 (default)'))
            print("  Listen Addr  : " + (addr.group(1) if addr and addr.group(1) else 'all interfaces'))
        EOF
      register: config_xml_servers
      changed_when: false
      failed_when: false
      when: domain_config_xml.stat.exists | default(false)

    - name: Print server stanzas from config.xml
      ansible.builtin.debug:
        msg: |
          === config.xml Server Stanzas ===
          {{ config_xml_servers.stdout if config_xml_servers.stdout | default('') else 'No server blocks found or config.xml not present' }}

    - name: Extract OHS HTTP listen port from httpd.conf
      ansible.builtin.shell: |
        grep -E '^\s*Listen\s+[0-9]+' \
          "{{ ohs_domain_home }}/config/fmwconfig/components/OHS/{{ ohs_component_name }}/httpd.conf" \
          | awk '{print $2}'
      register: ohs_http_port
      changed_when: false
      failed_when: false
      when: domain_httpd_conf.stat.exists | default(false)

    - name: Set OHS domain type fact
      ansible.builtin.set_fact:
        ohs_domain_type: >-
          {{
            'WebLogic Domain' if (
              domain_config_xml.stat.exists | default(false) or
              wls_nodemanager.rc == 0 or
              wls_adminserver.rc == 0 or
              wlserver_dir.stat.exists | default(false)
            ) else 'Standalone OHS Domain'
          }}

    - name: Print OHS domain type summary
      ansible.builtin.debug:
        msg: |
          === OHS Domain Type Summary ===
          Host              : {{ inventory_hostname }}
          Domain Type       : {{ ohs_domain_type }}
          Domain Home       : {{ ohs_domain_home }}
          Oracle Home       : {{ ohs_oracle_home }}
          OHS Component     : {{ ohs_component_name }}

          --- Ports ---
          AdminServer port  : {{ adminserver_port.stdout | default('N/A') }}
          OHS HTTP port     : {{ ohs_http_port.stdout | default('N/A') }}

          --- Indicators ---
          config.xml        : {{ 'YES' if domain_config_xml.stat.exists | default(false) else 'NO' }}
          httpd.conf        : {{ 'YES' if domain_httpd_conf.stat.exists | default(false) else 'NO' }}
          NodeManager proc  : {{ 'RUNNING' if wls_nodemanager.rc == 0 else 'NOT FOUND' }}
          AdminServer proc  : {{ 'RUNNING' if wls_adminserver.rc == 0 else 'NOT FOUND' }}
          wlserver dir      : {{ 'FOUND' if wlserver_dir.stat.exists | default(false) else 'NOT FOUND' }}
          OHS process       : {{ 'RUNNING' if ohs_process.rc == 0 else 'NOT FOUND' }}
