- name: Set oracle user fact
  ansible.builtin.set_fact:
    oracle_user: "{{ ohs_oracle_user | default('oracle') }}"

- name: Get OHS user login environment
  become: true
  block:
    - name: Get the OHS owner's login environment
      ansible.builtin.command: /usr/bin/env
      become_user: "{{ oracle_user }}"
      become_flags: "-i"
      register: ohs_user_environment
      changed_when: false
      check_mode: false

    - name: Get oracle user home directory
      ansible.builtin.command: getent passwd {{ oracle_user }}
      register: oracle_passwd_entry
      changed_when: false
      failed_when: false

    - name: Set oracle home dir fact
      ansible.builtin.set_fact:
        oracle_home_dir: "{{ oracle_passwd_entry.stdout.split(':')[5] }}"
      when: oracle_passwd_entry.rc == 0

    - name: Read oracle .bash_profile
      ansible.builtin.slurp:
        src: "{{ oracle_home_dir }}/.bash_profile"
      register: oracle_bash_profile
      failed_when: false
      when: oracle_home_dir is defined

    - name: Read oracle .bashrc
      ansible.builtin.slurp:
        src: "{{ oracle_home_dir }}/.bashrc"
      register: oracle_bashrc
      failed_when: false
      when: oracle_home_dir is defined

    - name: Print oracle .bash_profile content
      ansible.builtin.debug:
        msg: |
          === {{ oracle_home_dir }}/.bash_profile ===
          {{ oracle_bash_profile.content | b64decode }}
      when: oracle_home_dir is defined and oracle_bash_profile.content is defined

    - name: Print oracle .bashrc content
      ansible.builtin.debug:
        msg: |
          === {{ oracle_home_dir }}/.bashrc ===
          {{ oracle_bashrc.content | b64decode }}
      when: oracle_home_dir is defined and oracle_bashrc.content is defined

    - name: Print full OHS user environment
      ansible.builtin.debug:
        msg: |
          === Full oracle user environment ===
          {{ ohs_user_environment.stdout }}

    - name: Display Oracle environment variables
      ansible.builtin.debug:
        msg: >-
          {{ ohs_user_environment.stdout_lines
             | select('match', '^(ORACLE_HOME|MW_HOME|WL_HOME|DOMAIN_HOME|JAVA_HOME|PATH|LD_LIBRARY_PATH)=')
             | list }}




- name: Check Node Manager credential files
  become: true
  block:
    - name: Check stored Node Manager credential files
      ansible.builtin.stat:
        path: "~/.wlst/{{ item }}-{{ ohs_domain_name }}.props"
      become_user: "{{ oracle_user }}"
      become_flags: "-i"
      loop:
        - nm-key
        - nm-cfg
      register: nm_credential_files

    - name: Display file availability
      ansible.builtin.debug:
        msg: "{{ item.stat.path | default(item.item) }} exists={{ item.stat.exists }}"
      loop: "{{ nm_credential_files.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: Print last 100 lines of NodeManager, OHS and nohup logs
  become: true
  block:
    - name: Tail NodeManager log
      ansible.builtin.shell: |
        tail -100 "{{ ohs_domain_home }}/nodemanager/nodemanager.log" 2>/dev/null || echo "File not found"
      register: nm_log_tail
      changed_when: false
      failed_when: false

    - name: Print NodeManager log
      ansible.builtin.debug:
        msg: |
          === NodeManager Log (last 100 lines) ===
          {{ nm_log_tail.stdout }}

    - name: Tail OHS component log
      ansible.builtin.shell: |
        tail -100 "{{ ohs_domain_home }}/config/fmwconfig/components/OHS/{{ ohs_component_name }}/logs/{{ ohs_component_name }}.log" 2>/dev/null || echo "File not found"
      register: ohs_log_tail
      changed_when: false
      failed_when: false

    - name: Print OHS component log
      ansible.builtin.debug:
        msg: |
          === OHS Component Log (last 100 lines) ===
          {{ ohs_log_tail.stdout }}

    - name: Tail OHS error log
      ansible.builtin.shell: |
        tail -100 "{{ ohs_domain_home }}/config/fmwconfig/components/OHS/{{ ohs_component_name }}/logs/{{ ohs_component_name }}_error.log" 2>/dev/null || echo "File not found"
      register: ohs_error_log_tail
      changed_when: false
      failed_when: false

    - name: Print OHS error log
      ansible.builtin.debug:
        msg: |
          === OHS Error Log (last 100 lines) ===
          {{ ohs_error_log_tail.stdout }}

    - name: Find nohup.out files under domain home
      ansible.builtin.find:
        paths: "{{ ohs_domain_home }}"
        patterns: "nohup.out"
        recurse: true
      register: nohup_files
      failed_when: false

    - name: Tail each nohup.out file
      ansible.builtin.shell: |
        tail -100 "{{ item.path }}" 2>/dev/null || echo "File not found"
      loop: "{{ nohup_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      register: nohup_log_tails
      changed_when: false
      failed_when: false

    - name: Print nohup.out file contents
      ansible.builtin.debug:
        msg: |
          === nohup.out: {{ item.item.path }} (last 100 lines) ===
          {{ item.stdout }}
      loop: "{{ nohup_log_tails.results | default([]) }}"
      loop_control:
        label: "{{ item.item.path }}"

- name: Stop OHS Server
  become: true
  block:
    - name: Check OHS httpd process before stop
      ansible.builtin.shell: |
        ps -eo pid,ppid,args | grep "[h]ttpd" | awk '$2 == 1 {print $1, $3}'
      register: ohs_proc_before_stop
      changed_when: false
      failed_when: false

    - name: Print OHS process before stop
      ansible.builtin.debug:
        msg: |
          === OHS Process Before Stop ===
          {{ ohs_proc_before_stop.stdout if ohs_proc_before_stop.stdout else 'OHS not running' }}

    - name: Stop OHS component via stopComponent.sh
      ansible.builtin.shell: |
        {{ ohs_domain_home }}/bin/stopComponent.sh {{ ohs_component_name }}
      args:
        executable: /bin/bash
        chdir: "{{ ohs_domain_home }}/bin"
      become_user: "{{ oracle_user | default('oracle') }}"
      become_flags: "-i"
      register: ohs_stop_output
      changed_when: true
      failed_when: false
      when: ohs_proc_before_stop.stdout | default('') | length > 0

    - name: Print OHS stop output
      ansible.builtin.debug:
        msg: |
          === OHS Stop Output ===
          {{ ohs_stop_output.stdout | default('') }}
          {{ ohs_stop_output.stderr | default('') }}
      when: ohs_proc_before_stop.stdout | default('') | length > 0

    - name: Wait for OHS httpd process to exit
      ansible.builtin.shell: |
        ps -eo pid,ppid,args | grep "[h]ttpd" | awk '$2 == 1 {print $1}'
      register: ohs_proc_check
      changed_when: false
      failed_when: false
      retries: 6
      delay: 5
      until: ohs_proc_check.stdout | default('') | length == 0
      when: ohs_proc_before_stop.stdout | default('') | length > 0

    - name: Kill OHS httpd master if still running after stop
      ansible.builtin.shell: |
        ps -eo pid,ppid,args | grep "[h]ttpd" | awk '$2 == 1 {print $1}' | xargs -r kill -9
      register: ohs_kill_output
      changed_when: ohs_kill_output.rc == 0
      failed_when: false
      when: ohs_proc_before_stop.stdout | default('') | length > 0 and ohs_proc_check.stdout | default('') | length > 0

    - name: Print OHS stop result
      ansible.builtin.debug:
        msg: |
          === OHS Stop Result ===
          Was running : {{ 'YES' if ohs_proc_before_stop.stdout | default('') | length > 0 else 'NO - already stopped' }}
          Status      : {{ 'STOPPED' if ohs_proc_check.stdout | default('') | length == 0 else 'KILLED (force)' if ohs_kill_output is defined and ohs_kill_output.rc == 0 else 'UNKNOWN' }}

- name: Start OHS Server
  become: true
  block:
    - name: Check OHS httpd process before start
      ansible.builtin.shell: |
        ps -eo pid,ppid,args | grep "[h]ttpd" | awk '$2 == 1 {print $1, $3}'
      register: ohs_proc_before_start
      changed_when: false
      failed_when: false

    - name: Print OHS process before start
      ansible.builtin.debug:
        msg: |
          === OHS Process Before Start ===
          {{ ohs_proc_before_start.stdout if ohs_proc_before_start.stdout else 'OHS not running' }}

    - name: Start OHS component via startComponent.sh
      ansible.builtin.shell: |
        {{ ohs_domain_home }}/bin/startComponent.sh {{ ohs_component_name }}
      args:
        executable: /bin/bash
        chdir: "{{ ohs_domain_home }}/bin"
      become_user: "{{ oracle_user | default('oracle') }}"
      become_flags: "-i"
      register: ohs_start_output
      changed_when: true
      failed_when: false
      when: ohs_proc_before_start.stdout | default('') | length == 0

    - name: Print OHS start output
      ansible.builtin.debug:
        msg: |
          === OHS Start Output ===
          {{ ohs_start_output.stdout | default('') }}
          {{ ohs_start_output.stderr | default('') }}
      when: ohs_proc_before_start.stdout | default('') | length == 0

    - name: Wait for OHS httpd master process to appear
      ansible.builtin.shell: |
        ps -eo pid,ppid,args | grep "[h]ttpd" | awk '$2 == 1 {print $1}'
      register: ohs_proc_after_start
      changed_when: false
      failed_when: false
      retries: 6
      delay: 5
      until: ohs_proc_after_start.stdout | default('') | length > 0
      when: ohs_proc_before_start.stdout | default('') | length == 0

    - name: Print OHS start result
      ansible.builtin.debug:
        msg: |
          === OHS Start Result ===
          Was running : {{ 'YES - already running (PID: ' + ohs_proc_before_start.stdout.split()[0] + ')' if ohs_proc_before_start.stdout | default('') | length > 0 else 'NO' }}
          Status      : {{ 'RUNNING (PID: ' + ohs_proc_after_start.stdout | default('') | trim + ')' if ohs_proc_after_start.stdout | default('') | length > 0 else 'FAILED to start - check logs' }}
