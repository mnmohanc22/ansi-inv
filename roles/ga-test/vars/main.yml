---
# vars file for ga-test

ohs_oracle_user: oracle

opt_chown_list:
  - dir: keyfactor
  - dir: splunkforwarder
  - dir: puppet
  - dir: cisco
  - dir: nessus

docker_data_root: /var/lib/docker

containerd_data_root: /var/lib/containerd
containerd_state_dir: /run/containerd
containerd_snapshotter: overlayfs
containerd_systemd_cgroup: true
containerd_sandbox_image: registry.k8s.io/pause:3.9
