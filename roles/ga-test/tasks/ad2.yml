- name: List directories under /opt with ownership
  become: true
  block:
    - name: Get directory listing under /opt with ownership
      ansible.builtin.shell: |
        find /opt -maxdepth 1 -mindepth 1 -type d -exec stat --format="%n %U %G %A" {} \;
      register: opt_dirs
      changed_when: false
      failed_when: false

    - name: Print /opt directory listing with ownership
      ansible.builtin.debug:
        msg: |
          === Directories under /opt ===
          {% for line in opt_dirs.stdout_lines %}
          {{ line }}
          {% endfor %}
      when: opt_dirs.stdout | default('') | length > 0

- name: Change ownership of Keyfactor directory
  become: true
  block:
    - name: Check Keyfactor directory exists
      ansible.builtin.stat:
        path: "/opt/{{ keyfactor_dir | default('keyfactor') }}"
      register: keyfactor_dir_stat
      failed_when: false

    - name: Print Keyfactor directory current ownership
      ansible.builtin.shell: |
        stat --format="%n  owner=%U  group=%G  perms=%A" "/opt/{{ keyfactor_dir | default('keyfactor') }}"
      register: keyfactor_dir_before
      changed_when: false
      failed_when: false
      when: keyfactor_dir_stat.stat.exists | default(false)

    - name: Print current ownership before change
      ansible.builtin.debug:
        msg: |
          === Keyfactor Directory Before ===
          {{ keyfactor_dir_before.stdout | default('Directory not found: /opt/' + (keyfactor_dir | default('keyfactor'))) }}

    - name: Change ownership of Keyfactor directory
      ansible.builtin.file:
        path: "/opt/{{ keyfactor_dir | default('keyfactor') }}"
        owner: "{{ keyfactor_owner }}"
        group: "{{ keyfactor_group }}"
        recurse: true
      when: keyfactor_dir_stat.stat.exists | default(false)

    - name: Verify ownership after change
      ansible.builtin.shell: |
        stat --format="%n  owner=%U  group=%G  perms=%A" "/opt/{{ keyfactor_dir | default('keyfactor') }}"
      register: keyfactor_dir_after
      changed_when: false
      failed_when: false
      when: keyfactor_dir_stat.stat.exists | default(false)

    - name: Print ownership after change
      ansible.builtin.debug:
        msg: |
          === Keyfactor Directory After ===
          {{ keyfactor_dir_after.stdout | default('N/A') }}

- name: Change ownership of directories under /opt
  become: true
  block:
    - name: Check each directory exists under /opt
      ansible.builtin.stat:
        path: "/opt/{{ item.dir }}"
      loop: "{{ opt_chown_list }}"
      loop_control:
        label: "/opt/{{ item.dir }}"
      register: opt_chown_stat
      failed_when: false

    - name: Print ownership before change
      ansible.builtin.shell: |
        stat --format="%n  owner=%U  group=%G  perms=%A" "/opt/{{ item.item.dir }}"
      loop: "{{ opt_chown_stat.results }}"
      loop_control:
        label: "/opt/{{ item.item.dir }}"
      register: opt_chown_before
      changed_when: false
      failed_when: false
      when: item.stat.exists | default(false)

    - name: Display ownership before change
      ansible.builtin.debug:
        msg: |
          === Before ===
          {% for r in opt_chown_before.results %}
          {{ r.stdout | default('/opt/' + r.item.item.dir + ' - NOT FOUND') }}
          {% endfor %}

    - name: Change ownership of each directory
      ansible.builtin.file:
        path: "/opt/{{ item.item.dir }}"
        owner: "{{ item.item.owner | default('root') }}"
        group: "{{ item.item.group | default('root') }}"
        recurse: true
      loop: "{{ opt_chown_stat.results }}"
      loop_control:
        label: "/opt/{{ item.item.dir }}"
      when: item.stat.exists | default(false)

    - name: Verify ownership after change
      ansible.builtin.shell: |
        stat --format="%n  owner=%U  group=%G  perms=%A" "/opt/{{ item.item.dir }}"
      loop: "{{ opt_chown_stat.results }}"
      loop_control:
        label: "/opt/{{ item.item.dir }}"
      register: opt_chown_after
      changed_when: false
      failed_when: false
      when: item.stat.exists | default(false)

    - name: Display ownership after change
      ansible.builtin.debug:
        msg: |
          === After ===
          {% for r in opt_chown_after.results %}
          {{ r.stdout | default('/opt/' + r.item.item.dir + ' - skipped') }}
          {% endfor %}

- name: Check Keyfactor service status
  become: true
  block:
    - name: Check Keyfactor service status via systemctl
      ansible.builtin.systemd:
        name: "{{ keyfactor_service_name | default('keyfactor') }}"
      register: keyfactor_service
      failed_when: false

    - name: Check Keyfactor process
      ansible.builtin.shell: |
        pgrep -a -f "[k]eyfactor" || echo "No keyfactor process found"
      register: keyfactor_proc
      changed_when: false
      failed_when: false

    - name: Check Keyfactor version
      ansible.builtin.shell: |
        find /opt/{{ keyfactor_dir | default('keyfactor') }} -name "*.version" -o -name "version.txt" \
          2>/dev/null | head -1 | xargs cat 2>/dev/null || echo "Version file not found"
      register: keyfactor_version
      changed_when: false
      failed_when: false

    - name: Print Keyfactor service status summary
      ansible.builtin.debug:
        msg: |
          === Keyfactor Service Status ===
          Host            : {{ inventory_hostname }}
          Service Name    : {{ keyfactor_service_name | default('keyfactor') }}
          Service State   : {{ keyfactor_service.status.ActiveState | default('N/A') }}
          Service Sub     : {{ keyfactor_service.status.SubState | default('N/A') }}
          Enabled         : {{ keyfactor_service.status.UnitFileState | default('N/A') }}
          PID             : {{ keyfactor_service.status.MainPID | default('N/A') }}
          Install Dir     : /opt/{{ keyfactor_dir | default('keyfactor') }}
          Version         : {{ keyfactor_version.stdout | default('N/A') }}

          --- Process ---
          {{ keyfactor_proc.stdout }}

- name: Restart Keyfactor service
  become: true
  block:
    - name: Check Keyfactor service state before restart
      ansible.builtin.systemd:
        name: "{{ keyfactor_service_name | default('keyfactor') }}"
      register: keyfactor_before_restart
      failed_when: false

    - name: Print service state before restart
      ansible.builtin.debug:
        msg: |
          === Keyfactor Before Restart ===
          State   : {{ keyfactor_before_restart.status.ActiveState | default('N/A') }}
          PID     : {{ keyfactor_before_restart.status.MainPID | default('N/A') }}

    - name: Restart Keyfactor service
      ansible.builtin.systemd:
        name: "{{ keyfactor_service_name | default('keyfactor') }}"
        state: restarted
      register: keyfactor_restart
      failed_when: false

    - name: Wait for Keyfactor service to become active
      ansible.builtin.systemd:
        name: "{{ keyfactor_service_name | default('keyfactor') }}"
      register: keyfactor_after_restart
      retries: 6
      delay: 5
      until: keyfactor_after_restart.status.ActiveState == 'active'
      failed_when: false

    - name: Print Keyfactor restart result
      ansible.builtin.debug:
        msg: |
          === Keyfactor Restart Result ===
          Service   : {{ keyfactor_service_name | default('keyfactor') }}
          State     : {{ keyfactor_after_restart.status.ActiveState | default('N/A') }}
          Sub State : {{ keyfactor_after_restart.status.SubState | default('N/A') }}
          PID       : {{ keyfactor_after_restart.status.MainPID | default('N/A') }}
          Status    : {{ 'SUCCESS' if keyfactor_after_restart.status.ActiveState | default('') == 'active' else 'FAILED - check service logs' }}



