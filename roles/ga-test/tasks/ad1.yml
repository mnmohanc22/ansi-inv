- name: Check Docker installation on RHEL
  become: true
  block:
    - name: Check if docker binary exists
      ansible.builtin.command: which docker
      register: docker_binary
      changed_when: false
      failed_when: false

    - name: Check docker package via rpm
      ansible.builtin.command: rpm -q docker-ce
      register: docker_rpm
      changed_when: false
      failed_when: false

    - name: Get docker version if installed
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false
      failed_when: false
      when: docker_binary.rc == 0

    - name: Check docker service status
      ansible.builtin.systemd:
        name: docker
      register: docker_service
      changed_when: false
      failed_when: false
      when: docker_binary.rc == 0

    - name: Get Docker data directory from daemon.json
      ansible.builtin.shell: |
        grep -oP '"data-root"\s*:\s*"\K[^"]+' /etc/docker/daemon.json 2>/dev/null || echo '/var/lib/docker'
      register: docker_data_dir
      changed_when: false
      failed_when: false
      when: docker_binary.rc == 0

    - name: Check containerd package via rpm
      ansible.builtin.command: rpm -q containerd.io
      register: containerd_rpm
      changed_when: false
      failed_when: false

    - name: Get containerd version
      ansible.builtin.command: containerd --version
      register: containerd_version
      changed_when: false
      failed_when: false
      when: containerd_rpm.rc == 0

    - name: Check if /etc/containerd/config.toml exists
      ansible.builtin.stat:
        path: /etc/containerd/config.toml
      register: containerd_config_toml
      failed_when: false

    - name: Read /etc/containerd/config.toml
      ansible.builtin.slurp:
        src: /etc/containerd/config.toml
      register: containerd_config_content
      when: containerd_config_toml.stat.exists | default(false)
      failed_when: false

    - name: Print /etc/containerd/config.toml content
      ansible.builtin.debug:
        msg: "{{ containerd_config_content.content | b64decode }}"
      when: containerd_config_toml.stat.exists | default(false) and containerd_config_content.content is defined

    - name: Print containerd default config (config.toml not found)
      ansible.builtin.command: containerd config default
      register: containerd_default_config
      changed_when: false
      failed_when: false
      when: not (containerd_config_toml.stat.exists | default(false)) and containerd_rpm.rc == 0

    - name: Display containerd default config
      ansible.builtin.debug:
        msg: |
          === containerd default config (no config.toml present) ===
          {{ containerd_default_config.stdout }}
      when: not (containerd_config_toml.stat.exists | default(false)) and containerd_rpm.rc == 0

    - name: Get containerd data directory from config.toml
      ansible.builtin.shell: |
        grep -E '^\s*root\s*=' /etc/containerd/config.toml | head -1 | awk -F'"' '{print $2}'
      register: containerd_data_dir_raw
      changed_when: false
      failed_when: false
      when: containerd_config_toml.stat.exists | default(false)

    - name: Check containerd data directory disk usage
      ansible.builtin.shell: |
        dir="{{ containerd_data_dir_raw.stdout | default('/var/lib/containerd') | trim }}"
        dir="${dir:-/var/lib/containerd}"
        du -sh "$dir" 2>/dev/null || echo "N/A"
      register: containerd_du
      changed_when: false
      failed_when: false

    - name: Check Docker data directory disk usage
      ansible.builtin.shell: |
        du -sh "{{ docker_data_dir.stdout | default('/var/lib/docker') | trim }}" 2>/dev/null || echo "N/A"
      register: docker_du
      changed_when: false
      failed_when: false
      when: docker_binary.rc == 0

    - name: Print Docker and containerd data directories
      ansible.builtin.debug:
        msg: |
          === Docker & containerd Data Directories ===
          containerd package   : {{ containerd_rpm.stdout | default('not installed') }}
          containerd version   : {{ containerd_version.stdout | default('N/A') }}
          containerd config    : {{ 'EXISTS' if containerd_config_toml.stat.exists | default(false) else 'NOT FOUND (using defaults)' }}
          containerd data dir  : {{ containerd_data_dir_raw.stdout | default('') | trim or '/var/lib/containerd (default)' }}
          containerd dir size  : {{ containerd_du.stdout | default('N/A') }}
          Docker data dir      : {{ docker_data_dir.stdout | default('/var/lib/docker') | trim }}
          Docker data dir size : {{ docker_du.stdout | default('N/A') }}

- name: Install Docker CE on RHEL
  become: true
  when: docker_binary.rc != 0
  block:
    - name: Add Docker CE yum repository
      ansible.builtin.yum_repository:
        name: docker-ce
        description: Docker CE Stable
        baseurl: https://download.docker.com/linux/rhel/$releasever/$basearch/stable
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/rhel/gpg
        enabled: true

    - name: Install docker-ce, docker-ce-cli, containerd.io
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Deploy Docker daemon.json from template
      ansible.builtin.template:
        src: daemon.json.j2
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
      notify: restart docker

    - name: Ensure /etc/containerd directory exists
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy containerd config.toml from template
      ansible.builtin.template:
        src: containerd_config.toml.j2
        dest: /etc/containerd/config.toml
        owner: root
        group: root
        mode: '0644'
      notify: restart containerd

    - name: Start and enable docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Verify docker installed after install
      ansible.builtin.command: docker --version
      register: docker_version_post
      changed_when: false

    - name: Print Docker install result
      ansible.builtin.debug:
        msg: |
          === Docker CE Install Result ===
          {{ docker_version_post.stdout }}

- name: Print Docker status summary
      ansible.builtin.debug:
        msg: |
          === Docker Installation Summary ===
          Host            : {{ inventory_hostname }}
          Binary found    : {{ 'YES' if docker_binary.rc == 0 else 'NO' }}
          Package (rpm)   : {{ docker_rpm.stdout if docker_rpm.rc == 0 else 'not installed' }}
          Version         : {{ docker_version.stdout if docker_binary.rc == 0 else 'N/A' }}
          Service state   : {{ docker_service.status.ActiveState | default('N/A') }}
          Service enabled : {{ docker_service.status.UnitFileState | default('N/A') }}
