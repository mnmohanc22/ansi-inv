---
# Section 3 | Network Configuration - Audit Checks
# CIS Red Hat Enterprise Linux 9 Benchmark v2.0.0 L1

# 3.1.2
- name: "Audit | 3.1.2 Ensure wireless interfaces are disabled"
  ansible.builtin.shell: |
    if command -v nmcli &>/dev/null; then
      nmcli radio wifi 2>/dev/null | grep -qi 'disabled' && echo "PASS" || echo "FAIL"
    else
      echo "PASS"
    fi
  register: cis_3_1_2
  changed_when: false
  failed_when: false

- name: "Audit | 3.1.2 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '3.1.2', 'title': 'Ensure wireless interfaces are disabled', 'status': 'PASS' if 'PASS' in cis_3_1_2.stdout else 'FAIL'}] }}"

# 3.1.3
- name: "Audit | 3.1.3 Ensure bluetooth services are not in use"
  ansible.builtin.shell: |
    systemctl is-enabled bluetooth 2>/dev/null | grep -qE 'enabled' && echo "FAIL" || echo "PASS"
  register: cis_3_1_3
  changed_when: false
  failed_when: false

- name: "Audit | 3.1.3 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '3.1.3', 'title': 'Ensure bluetooth services are not in use', 'status': 'PASS' if 'PASS' in cis_3_1_3.stdout else 'FAIL'}] }}"

# 3.2.1
- name: "Audit | 3.2.1 Ensure dccp kernel module is not available"
  ansible.builtin.shell: |
    ! lsmod | grep -q dccp && \
    modprobe --showconfig | grep -Pq '\binstall\h+dccp\h+/bin/(true|false)\b' && \
    echo "PASS" || echo "FAIL"
  register: cis_3_2_1
  changed_when: false
  failed_when: false

