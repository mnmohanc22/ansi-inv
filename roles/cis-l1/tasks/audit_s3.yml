- name: "Audit | Section 3 Summary Header"
  ansible.builtin.debug:
    msg:
      - "===== Section 3 | Network Configuration - Audit Summary ====="
      - "Total : {{ s3_results | length }}"
      - "PASS  : {{ s3_results | selectattr('status', 'eq', 'PASS') | list | length }}"
      - "FAIL  : {{ s3_results | selectattr('status', 'eq', 'FAIL') | list | length }}"
      - "-------------------------------------------------------"
  vars:
    s3_results: "{{ cis_audit_results | selectattr('id', 'match', '^3\\.') | list }}"

- name: "Audit | Section 3 Summary Items"
  ansible.builtin.debug:
    msg: "[{{ item.status }}]  {{ item.id }} - {{ item.title }}"
  loop: "{{ cis_audit_results | selectattr('id', 'match', '^3\\.') | list }}"
  loop_control:
    label: "{{ item.id }}"

- name: "Audit | Section 3 build summary lines"
  ansible.builtin.set_fact:
    s3_summary_lines: "{{ (s3_summary_lines | default([])) + ['[' + item.status + ']  ' + item.id + ' - ' + item.title] }}"
  loop: "{{ cis_audit_results | selectattr('id', 'match', '^3\\.') | list }}"
  loop_control:
    label: "{{ item.id }}"

- name: "Audit | Section 3 Summary Items - Single Message"
  ansible.builtin.debug:
    msg: "{{ s3_summary_lines }}"
