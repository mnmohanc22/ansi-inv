# 3.3.1
- name: "Audit | 3.3.1 Ensure ip forwarding is disabled"
  ansible.builtin.shell: |
    sysctl net.ipv4.ip_forward | grep -q '= 0' && \
    grep -qrP '^\s*net\.ipv4\.ip_forward\s*=\s*0\b' /etc/sysctl.conf /etc/sysctl.d/*.conf 2>/dev/null && \
    echo "PASS" || echo "FAIL"
