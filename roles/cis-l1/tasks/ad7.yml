- name: "CIS 6.2.3.5 | Check rsyslog service status"
  block:
    - name: "CIS 6.2.3.5 | Get rsyslog service status"
      ansible.builtin.shell: |
        echo "Enabled: $(systemctl is-enabled rsyslog 2>/dev/null || true)"
        echo "Active:  $(systemctl is-active rsyslog 2>/dev/null || true)"
      register: rsyslog_status
      changed_when: false

    - name: "CIS 6.2.3.5 | Display rsyslog service status"
      ansible.builtin.debug:
        var: rsyslog_status.stdout_lines


- name: "CIS 6.2.3.5 | Check existing rsyslog logging configuration"
  block:
    - name: "CIS 6.2.3.5 | Get existing rsyslog configuration"
      ansible.builtin.shell: |
        grep -RHnEv '^[[:space:]]*(#|$)' \
          /etc/rsyslog.conf \
          /etc/rsyslog.d/*.conf 2>/dev/null || true
      register: rsyslog_config
      changed_when: false

    - name: "CIS 6.2.3.5 | Display existing rsyslog configuration"
      ansible.builtin.debug:
        var: rsyslog_config.stdout_lines


- name: "CIS 6.2.3.5 | Check standard log destinations"
  block:
    - name: "CIS 6.2.3.5 | Get standard log destinations"
      ansible.builtin.shell: |
        grep -RHniE \
          '/var/log/(messages|secure|maillog|cron|warn)|:omusrmsg:' \
          /etc/rsyslog.conf \
          /etc/rsyslog.d/*.conf 2>/dev/null || true
      register: rsyslog_destinations
      changed_when: false

    - name: "CIS 6.2.3.5 | Display standard log destinations"
      ansible.builtin.debug:
        var: rsyslog_destinations.stdout_lines


- name: "CIS 6.2.3.5 | Check imjournal configuration"
  block:
    - name: "CIS 6.2.3.5 | Get imjournal configuration"
      ansible.builtin.shell: |
        grep -RHniE 'imjournal' \
          /etc/rsyslog.conf \
          /etc/rsyslog.d/*.conf 2>/dev/null || true
      register: rsyslog_imjournal
      changed_when: false

    - name: "CIS 6.2.3.5 | Display imjournal configuration"
      ansible.builtin.debug:
        var: rsyslog_imjournal.stdout_lines


- name: "CIS 6.2.3.5 | Validate existing rsyslog configuration"
  block:
    - name: "CIS 6.2.3.5 | Run rsyslog config validation"
      ansible.builtin.command:
        cmd: rsyslogd -N1
      register: rsyslog_validation
      changed_when: false
      failed_when: false

    - name: "CIS 6.2.3.5 | Display rsyslog validation result"
      ansible.builtin.debug:
        msg:
          - "Return code : {{ rsyslog_validation.rc }}"
          - "{{ rsyslog_validation.stderr_lines }}"



- name: "CIS 6.2.3.5 | Deploy and validate rsyslog configuration"
  block:
    - name: "CIS 6.2.3.5 | Deploy rsyslog CIS config from template"
      ansible.builtin.template:
        src: cis-rsyslog.conf.j2
        dest: /etc/rsyslog.d/60-cis-logging.conf
        owner: root
        group: root
        mode: '0640'
        backup: true
        validate: '/usr/sbin/rsyslogd -N1 -f %s'
      register: rsyslog_deployed

    - name: "CIS 6.2.3.5 | Restart rsyslog to apply new config"
      ansible.builtin.systemd:
        name: rsyslog
        state: restarted
      when: rsyslog_deployed.changed


- name: "CIS 2.1.12 | Check rpcbind install status"
  block:
    - name: "CIS 2.1.12 | Check whether rpcbind is installed"
      ansible.builtin.command:
        cmd: rpm -q rpcbind
      register: rpcbind_package
      changed_when: false
      failed_when: false

    - name: "CIS 2.1.12 | Display rpcbind install status"
      ansible.builtin.debug:
        msg: "rpcbind status : {{ 'INSTALLED' if rpcbind_package.rc == 0 else 'NOT INSTALLED' }}"


- name: "CIS 2.1.12 | Stop and mask rpcbind units"
  block:
    - name: "CIS 2.1.12 | Stop and mask rpcbind units"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop:
        - rpcbind.service
        - rpcbind.socket
      when: rpcbind_package.rc == 0

    - name: "CIS 2.1.12 | Check rpcbind.service status"
      ansible.builtin.shell: |
        systemctl is-active rpcbind.service || true
      register: rpcbind_service_status
      changed_when: false
      failed_when: false

    - name: "CIS 2.1.12 | Check rpcbind.socket status"
      ansible.builtin.shell: |
        systemctl is-active rpcbind.socket || true
      register: rpcbind_socket_status
      changed_when: false
      failed_when: false

    - name: "CIS 2.1.12 | Display rpcbind unit status"
      ansible.builtin.debug:
        msg:
          - "rpcbind.service : {{ rpcbind_service_status.stdout | default('unknown') }}"
          - "rpcbind.socket  : {{ rpcbind_socket_status.stdout | default('unknown') }}"
