- name: "CIS 7.2.9 | Audit insecure dot files"
  block:
    - name: "CIS 7.2.9 | Get local interactive users"
      ansible.builtin.shell: |
        awk -F: '
          ($3 >= 1000 &&
           $1 != "nobody" &&
           $7 !~ /(nologin|false)$/) {
            print $1 ":" $6
          }' /etc/passwd
      register: local_interactive_users
      changed_when: false

    - name: "CIS 7.2.9 | Find insecure dot files"
      ansible.builtin.shell: |
        user="{{ item.split(':')[0] }}"
        home="{{ item.split(':')[1] }}"

        if [ -d "$home" ]; then
          find "$home" -xdev -maxdepth 1 \
            -type f \
            -name '.*' \
            -perm /0022 \
            -printf '%m %u %g %p\n' 2>/dev/null
        fi
      loop: "{{ local_interactive_users.stdout_lines }}"
      loop_control:
        label: "{{ item.split(':')[0] }}"
      register: insecure_dotfiles
      changed_when: false

    - name: "CIS 7.2.9 | Display insecure dot files"
      ansible.builtin.debug:
        var: item.stdout_lines
      loop: "{{ insecure_dotfiles.results }}"
      loop_control:
        label: "{{ item.item.split(':')[0] }}"
      when: item.stdout_lines | length > 0



- name: "CIS 7.2.9 | Remediate insecure dot files"
  block:
    - name: "CIS 7.2.9 | Find dot files requiring remediation"
      ansible.builtin.shell: |
        home="{{ item.split(':')[1] }}"

        if [ -d "$home" ]; then
          find "$home" -xdev -maxdepth 1 \
            -type f \
            -name '.*' \
            -perm /0022 \
            -print 2>/dev/null
        fi
      loop: "{{ local_interactive_users.stdout_lines }}"
      loop_control:
        label: "{{ item.split(':')[0] }}"
      register: dotfiles_to_fix
      changed_when: false

    - name: "CIS 7.2.9 | Remove group and world write from dot files"
      ansible.builtin.file:
        path: "{{ item.1 }}"
        mode: 'go-w'
      loop: "{{ dotfiles_to_fix.results | subelements('stdout_lines', skip_missing=True) }}"
      loop_control:
        label: "{{ item.1 }}"
      register: dotfiles_chmod

    - name: "CIS 7.2.9 | Display remediated dot files"
      ansible.builtin.debug:
        msg: "permissions updated : {{ item.item.1 }}"
      loop: "{{ dotfiles_chmod.results }}"
      loop_control:
        label: "{{ item.item.1 }}"
      when: item.changed | default(false)



- name: "CIS 7.2.9 | Secure bash history files"
  block:
    - name: "CIS 7.2.9 | Check bash history files"
      ansible.builtin.stat:
        path: "{{ item.split(':')[1] }}/.bash_history"
      loop: "{{ local_interactive_users.stdout_lines }}"
      loop_control:
        label: "{{ item.split(':')[0] }}"
      register: bash_history_files
      changed_when: false

    - name: "CIS 7.2.9 | Display bash history file stats"
      ansible.builtin.debug:
        msg:
          - "user : {{ item.item.split(':')[0] }}"
          - "path : {{ item.stat.path | default('N/A') }}"
          - "exists : {{ item.stat.exists }}"
          - "mode : {{ item.stat.mode | default('N/A') }}"
      loop: "{{ bash_history_files.results }}"
      loop_control:
        label: "{{ item.item.split(':')[0] }}"

    - name: "CIS 7.2.9 | Secure bash history files"
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        owner: "{{ item.item.split(':')[0] }}"
        mode: '0600'
      loop: "{{ bash_history_files.results }}"
      loop_control:
        label: "{{ item.item.split(':')[0] }}"
      when:
        - item.stat.exists | default(false)
        - item.stat.isreg | default(false)
      register: bash_history_chmod

    - name: "CIS 7.2.9 | Display secured bash history files"
      ansible.builtin.debug:
        msg: "permissions updated : {{ item.item.stat.path }}"
      loop: "{{ bash_history_chmod.results }}"
      loop_control:
        label: "{{ item.item.item.split(':')[0] }}"
      when: item.changed | default(false)




- name: "CIS 7.2.9 | Audit sensitive user dot files"
  block:
    - name: "CIS 7.2.9 | Check sensitive user dot files"
      ansible.builtin.shell: |
        home="{{ item.split(':')[1] }}"

        for f in .forward .rhosts .netrc; do
          if [ -e "$home/$f" ]; then
            stat -Lc '%a %U %G %n' "$home/$f"
          fi
        done
      loop: "{{ local_interactive_users.stdout_lines }}"
      loop_control:
        label: "{{ item.split(':')[0] }}"
      register: sensitive_dotfiles
      changed_when: false

    - name: "CIS 7.2.9 | Display sensitive dot files"
      ansible.builtin.debug:
        var: item.stdout_lines
      loop: "{{ sensitive_dotfiles.results }}"
      loop_control:
        label: "{{ item.item.split(':')[0] }}"
      when: item.stdout_lines | length > 0




- name: "CIS 5.4.1.5 | Check useradd inactive setting"
  block:
    - name: "CIS 5.4.1.5 | Check useradd inactive setting"
      ansible.builtin.shell: |
        echo "===== useradd -D ====="
        useradd -D

        echo
        echo "===== Exact INACTIVE line ====="
        useradd -D | grep '^INACTIVE=' | cat -A

        echo
        echo "===== /etc/default/useradd ====="
        grep -nE '^[[:space:]]*INACTIVE[[:space:]]*=' \
          /etc/default/useradd | cat -A || true
      register: inactive_audit
      changed_when: false

    - name: "CIS 5.4.1.5 | Display inactive audit"
      ansible.builtin.debug:
        var: inactive_audit.stdout_lines



- name: "CIS 5.4.1.5 | Check exact useradd INACTIVE output"
  block:
    - name: "CIS 5.4.1.5 | Check exact useradd INACTIVE output"
      ansible.builtin.shell: |
        /sbin/useradd -D | /bin/grep 'INACTIVE' | cat -A
      register: inactive_check
      changed_when: false

    - name: "CIS 5.4.1.5 | Display exact INACTIVE output"
      ansible.builtin.debug:
        var: inactive_check.stdout_lines


- name: "CIS 5.4.1.5 | Check existing users inactive days"
  block:
    - name: "CIS 5.4.1.5 | Check existing users inactive days"
      ansible.builtin.shell: |
        awk -F: '
          ($2 ~ /^\$.+\$/) {
            print $1 ": INACTIVE=" $7
          }
        ' /etc/shadow
      register: inactive_users
      changed_when: false

    - name: "CIS 5.4.1.5 | Display inactive user settings"
      ansible.builtin.debug:
        var: inactive_users.stdout_lines          


- name: "CIS 5.4.1.5 | Find existing users with non-compliant inactive days"
  block:
    - name: "CIS 5.4.1.5 | Find existing users with non-compliant inactive days"
      ansible.builtin.shell: |
        awk -F: '
          ($2 ~ /^\$.+\$/ && ($7 < 0 || $7 > 30)) {
            print $1 ":" $7
          }
        ' /etc/shadow
      register: inactive_noncompliant
      changed_when: false

    - name: "CIS 5.4.1.5 | Display non-compliant users"
      ansible.builtin.debug:
        var: inactive_noncompliant.stdout_lines        



- name: "CIS 5.4.1.5 | Check inactive days for password-enabled users"
  block:
    - name: "CIS 5.4.1.5 | Check inactive days for password-enabled users"
      ansible.builtin.shell: |
        awk -F: '
          ($2 ~ /^\$.+\$/) {
            printf "%-25s INACTIVE=%s\n", $1, ($7 == "" ? "EMPTY" : $7)
          }
        ' /etc/shadow
      register: cis_inactive_users
      changed_when: false

    - name: "CIS 5.4.1.5 | Display inactive days"
      ansible.builtin.debug:
        var: cis_inactive_users.stdout_lines        



- name: "CIS 5.4.1.5 | Set default inactive password lock to 30 days"
  block:
    - name: "CIS 5.4.1.5 | Get useradd defaults"
      ansible.builtin.command:
        cmd: /sbin/useradd -D
      register: useradd_defaults
      changed_when: false

    - name: "CIS 5.4.1.5 | Set default inactive password lock to 30 days"
      ansible.builtin.command:
        cmd: /sbin/useradd -D -f 30
      when: "'INACTIVE=30' not in useradd_defaults.stdout"
      register: useradd_inactive_set

    - name: "CIS 5.4.1.5 | Display inactive lock status"
      ansible.builtin.debug:
        msg: "inactive lock : {{ 'SET to 30 days' if useradd_inactive_set.changed else 'already 30 days - no change' }}"


- name: "CIS 4.2.2 | Ensure firewalld loopback traffic is configured"
  block:
    - name: "CIS 4.2.2 | Ensure firewalld loopback traffic is configured"
      ansible.builtin.shell: |
        { l_hbfw=""

          if systemctl is-enabled firewalld.service | grep -q 'enabled'; then
            echo -e "\n - FirewallD is in use on the system"
            l_hbfw="fwd"

          elif systemctl is-enabled nftables.service 2>/dev/null | grep -q 'enabled'; then
            echo -e "\n - nftables is in use on the system"
            echo -e " - Recommendation is NA"
            echo -e " - Remediation Complete"
            l_hbfw="nft"
          fi

          if [ "$l_hbfw" = "fwd" ]; then

            l_ipsaddr="$(nft list ruleset |
              awk '/filter_IN_public_deny|hook\s+input\s+/,/\}\s*(#.*)?$/' |
              grep -P -- 'ip\h+saddr')"

            if ! nft list ruleset |
              awk '/hook\s+input\s+/,/\}\s*(#.*)?$/' |
              grep -Pq -- '\H+\h+"lo"\h+accept'; then

              echo -e "\n - Enabling input to accept for loopback address"

              firewall-cmd --permanent --zone=trusted --add-interface=lo
              firewall-cmd --reload

            else

              echo -e "\n - firewalld input correctly set to accept for loopback address"

              if ! grep -Pq -- \
                'ip\h+saddr\h+127\.0\.0\.0\/8\h+(counter\h+packets\h+\d+\h+bytes\h+\d+\h+)?drop' \
                <<< "$l_ipsaddr" &&
                 ! grep -Pq -- \
                'ip\h+daddr\h+\!\=\h+127\.0\.0\.1\h+ip\h+saddr\h+127\.0\.0\.1\h+drop' \
                <<< "$l_ipsaddr"; then

                echo -e "\n - Setting IPv4 network traffic from loopback address to drop"

                firewall-cmd --permanent \
                  --add-rich-rule='rule family=ipv4 source address="127.0.0.1" destination not address="127.0.0.1" drop'

                firewall-cmd --permanent --zone=trusted \
                  --add-rich-rule='rule family=ipv4 source address="127.0.0.1" destination not address="127.0.0.1" drop'

                firewall-cmd --reload

              else
                echo -e "\n - firewalld correctly set IPv4 network traffic from loopback address to drop"
              fi

              if grep -Pq -- '^\h*0\h*$' /sys/module/ipv6/parameters/disable; then

                l_ip6saddr="$(nft list ruleset |
                  awk '/filter_IN_public_deny|hook input/,/}/' |
                  grep 'ip6 saddr')"

                if ! grep -Pq \
                  'ip6\h+saddr\h+::1\h+(counter\h+packets\h+\d+\h+bytes\h+\d+\h+)?drop' \
                  <<< "$l_ip6saddr" &&
                   ! grep -Pq -- \
                  'ip6\h+daddr\h+\!=\h+::1\h+ip6\h+saddr\h+::1\h+drop' \
                  <<< "$l_ip6saddr"; then

                  echo -e "\n - Setting IPv6 network traffic from loopback address to drop"

                  firewall-cmd --permanent \
                    --add-rich-rule='rule family=ipv6 source address="::1" destination not address="::1" drop'

                  firewall-cmd --permanent --zone=trusted \
                    --add-rich-rule='rule family=ipv6 source address="::1" destination not address="::1" drop'

                  firewall-cmd --reload

                else
                  echo -e "\n - firewalld correctly set IPv6 network traffic from loopback address to drop"
                fi
              fi
            fi
          fi
        }
      args:
        executable: /bin/bash
      register: cis_4_2_2
      changed_when: >
        'Enabling input' in cis_4_2_2.stdout or
        'Setting IPv4' in cis_4_2_2.stdout or
        'Setting IPv6' in cis_4_2_2.stdout

    - name: "CIS 4.2.2 | Display loopback configuration result"
      ansible.builtin.debug:
        var: cis_4_2_2.stdout_lines




- name: "CIS 4.2.2 | Verify loopback nft rules"
  block:
    - name: "CIS 4.2.2 | Check loopback interface accept rule"
      ansible.builtin.shell: |
        nft list ruleset |
        awk '/hook\s+input\s+/,/\}\s*(#.*)?$/' |
        grep -P -- '\H+\h+"lo"\h+accept' || true
      args:
        executable: /bin/bash
      register: cis_lo_accept_rule
      changed_when: false

    - name: "CIS 4.2.2 | Display loopback accept rule"
      ansible.builtin.debug:
        var: cis_lo_accept_rule.stdout_lines

    - name: "CIS 4.2.2 | Check IPv4 loopback nft rules using Tenable logic"
      ansible.builtin.shell: |
        nft list ruleset |
        awk '/filter_IN_public_deny|hook\s+input\s+/,/\}\s*(#.*)?$/' |
        grep -P -- 'ip\h+saddr' || true
      args:
        executable: /bin/bash
      register: cis_ipv4_nft_rules
      changed_when: false

    - name: "CIS 4.2.2 | Display IPv4 loopback nft rules"
      ansible.builtin.debug:
        var: cis_ipv4_nft_rules.stdout_lines

    - name: "CIS 4.2.2 | Check IPv6 loopback nft rules using Tenable logic"
      ansible.builtin.shell: |
        nft list ruleset |
        awk '/filter_IN_public_deny|hook input/,/}/' |
        grep 'ip6 saddr' || true
      args:
        executable: /bin/bash
      register: cis_ipv6_nft_rules
      changed_when: false

    - name: "CIS 4.2.2 | Display IPv6 loopback nft rules"
      ansible.builtin.debug:
        var: cis_ipv6_nft_rules.stdout_lines        


- name: "CIS 4.2.2 | Test Tenable IPv4 regex against nft rule"
  block:
    - name: "CIS 4.2.2 | Test Tenable IPv4 regex against nft rule"
      ansible.builtin.shell: |
        nft list ruleset |
        awk '/filter_IN_public_deny|hook\s+input\s+/,/\}\s*(#.*)?$/' |
        grep -P -- 'ip\h+saddr' |
        grep -Pq -- \
        'ip\h+saddr\h+127\.0\.0\.0\/8\h+(counter\h+packets\h+\d+\h+bytes\h+\d+\h+)?drop'
      args:
        executable: /bin/bash
      register: cis_ipv4_tenable_match
      changed_when: false
      failed_when: false

    - name: "CIS 4.2.2 | Display Tenable regex result"
      ansible.builtin.debug:
        msg:
          - "Tenable regex rc = {{ cis_ipv4_tenable_match.rc }}"
          - "Tenable regex match = {{ cis_ipv4_tenable_match.rc == 0 }}"


- name: "CIS 5.4.1.1 | Set password maximum age to 90 days"
  block:
    - name: "CIS 5.4.1.1 | Find users with non-compliant password maximum age"
      ansible.builtin.shell: |
        awk -F: '
          ($2 ~ /^\$.+\$/ && ($5 > 90 || $5 < 1)) {
            print $1
          }
        ' /etc/shadow
      register: cis_pass_max_users
      changed_when: false

    - name: "CIS 5.4.1.1 | Display non-compliant users"
      ansible.builtin.debug:
        var: cis_pass_max_users.stdout_lines

    - name: "CIS 5.4.1.1 | Set password maximum age to 90 days"
      ansible.builtin.command:
        cmd: "chage --maxdays 90 {{ item }}"
      loop: "{{ cis_pass_max_users.stdout_lines }}"
      loop_control:
        label: "{{ item }}"
      when: cis_pass_max_users.stdout_lines | length > 0
      register: cis_pass_max_set

    - name: "CIS 5.4.1.1 | Display updated users"
      ansible.builtin.debug:
        msg: "maxdays set : {{ item.item }}"
      loop: "{{ cis_pass_max_set.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.changed | default(false)          




- name: "Display RHEL system information"
  block:
    - name: "Get RHEL release"
      ansible.builtin.command:
        cmd: cat /etc/redhat-release
      register: rhel_release
      changed_when: false

    - name: "Display RHEL release"
      ansible.builtin.debug:
        msg: "{{ rhel_release.stdout }}"

    - name: "Display RHEL OS details"
      ansible.builtin.debug:
        msg:
          - "Distribution: {{ ansible_distribution }}"
          - "Version: {{ ansible_distribution_version }}"
          - "Major Version: {{ ansible_distribution_major_version }}"
          - "OS Family: {{ ansible_os_family }}"
          - "Kernel: {{ ansible_kernel }}"
          - "Architecture: {{ ansible_architecture }}"  
  when: ansible_distribution == "RedHat" or ansible_distribution == "CentOS" or ansible_distribution == "Rocky" or ansible_distribution == "AlmaLinux"          



- name: "CIS 1.7.3 | Check local and remote banners"
  block:
    - name: "CIS 1.7.3 | Check local and remote banners"
      ansible.builtin.shell: |
        echo "===== /etc/issue ====="
        cat /etc/issue 2>/dev/null || true

        echo
        echo "===== /etc/issue.net ====="
        cat /etc/issue.net 2>/dev/null || true
      register: cis_banners
      changed_when: false

    - name: "CIS 1.7.3 | Display banners"
      ansible.builtin.debug:
        var: cis_banners.stdout_lines


- name: "CIS 1.7.3 | Configure remote login warning banner"
  block:
    - name: "CIS 1.7.3 | Configure remote login warning banner"
      ansible.builtin.copy:
        dest: /etc/issue.net
        content: |
          Authorized users only. All activity may be monitored and reported.
        owner: root
        group: root
        mode: '0644'
      register: cis_issue_net

    - name: "CIS 1.7.3 | Display remote login banner status"
      ansible.builtin.debug:
        msg: "remote login banner : {{ 'UPDATED' if cis_issue_net.changed else 'already configured - no change' }}"