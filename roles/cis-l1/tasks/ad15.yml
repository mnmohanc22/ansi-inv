


- name: "Download Elastic Agent tar file from URL"
  block:
    - name: "Create temporary installation directory"
      ansible.builtin.file:
        path: "{{ elastic_agent_work_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: "Download Elastic Agent tar file"
      ansible.builtin.get_url:
        url: "{{ elastic_agent_download_url }}"
        dest: "{{ elastic_agent_work_dir }}/{{ elastic_agent_archive }}"
        owner: root
        group: root
        mode: "0640"
        timeout: 120
        validate_certs: true
      register: elastic_download

    - name: "Display Elastic Agent download status"
      ansible.builtin.debug:
        msg: "tar file download : {{ 'DOWNLOADED' if elastic_download.changed else 'already present - no change' }}"


- name: "Copy Elastic Agent tar file to managed servers"
  block:
    - name: "Create temporary installation directory"
      ansible.builtin.file:
        path: "{{ elastic_agent_work_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: "Copy Elastic Agent tar file from role files directory"
      ansible.builtin.copy:
        src: "{{ elastic_agent_archive }}"
        dest: "{{ elastic_agent_work_dir }}/{{ elastic_agent_archive }}"
        owner: root
        group: root
        mode: "0640"
      register: elastic_copy

    - name: "Display Elastic Agent copy status"
      ansible.builtin.debug:
        msg: "tar file copy : {{ 'COPIED' if elastic_copy.changed else 'already present - no change' }}"




- name: "Install Elastic Agent"
  become: true
  when: not elastic_agent_installed.stat.exists
  block:
    - name: "Create temporary installation directory"
      ansible.builtin.file:
        path: "{{ elastic_agent_work_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: "Download Elastic Agent tar file"
      ansible.builtin.get_url:
        url: "{{ elastic_agent_download_url }}"
        dest: "{{ elastic_agent_work_dir }}/{{ elastic_agent_archive }}"
        owner: root
        group: root
        mode: "0640"
        timeout: 120
        validate_certs: true
        

    - name: "Check if Elastic Agent install directory exists"
      ansible.builtin.stat:
        path: /opt/Elastic/Agent
      register: elastic_agent_dir

    - name: "Display Elastic Agent install directory status"
      ansible.builtin.debug:
        msg: "install dir /opt/Elastic/Agent : {{ 'EXISTS - skipping extract' if elastic_agent_dir.stat.exists else 'NOT FOUND - will extract' }}"

    - name: "Create Elastic Agent install directory"
      ansible.builtin.file:
        path: /opt/Elastic/Agent
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: "Extract Elastic Agent tar file"
      ansible.builtin.unarchive:
        src: "{{ elastic_agent_work_dir }}/{{ elastic_agent_archive }}"
        dest: /opt/Elastic/Agent
        remote_src: true
        extra_opts:
          - "--strip-components=1"
      when: not elastic_agent_dir.stat.exists
      register: elastic_extract

    - name: "Display Elastic Agent extract status"
      ansible.builtin.debug:
        msg: "tar file extract : {{ 'EXTRACTED' if elastic_extract.changed else 'already present - no change' }}"
      when: not elastic_agent_dir.stat.exists





- name: "Remove Elastic Agent temporary work directory"
  become: true
  block:
    - name: "Remove Elastic Agent work directory"
      ansible.builtin.file:
        path: "{{ elastic_agent_work_dir }}"
        state: absent
      register: elastic_workdir_removed

    - name: "Display work directory removal status"
      ansible.builtin.debug:
        msg: "work dir {{ elastic_agent_work_dir }} : {{ 'REMOVED' if elastic_workdir_removed.changed else 'already absent - no change' }}"


- name: "Install and enroll Elastic Agent"
  block:
    - name: "Install and enroll Elastic Agent"
      ansible.builtin.command:
        argv:
          - /opt/Elastic/Agent/elastic-agent
          - install
          - "--url={{ fleet_server_url }}"
          - "--enrollment-token={{ fleet_enrollment_token }}"
          - "--non-interactive"
      no_log: true
      register: elastic_enroll

    - name: "Display Elastic Agent enrollment status"
      ansible.builtin.debug:
        msg: "enrollment : {{ 'COMPLETED' if elastic_enroll.changed else 'already enrolled - no change' }}"

    - name: "Check Elastic Agent service status"
      ansible.builtin.command:
        argv:
          - /opt/Elastic/Agent/elastic-agent
          - status
      register: elastic_agent_status
      changed_when: false
      failed_when: elastic_agent_status.rc != 0

    - name: "Display Elastic Agent status"
      ansible.builtin.debug:
        var: elastic_agent_status.stdout_lines



- name: "Collect Elastic Agent installation failure logs"
  block:
    - name: "Collect Elastic Agent service logs"
      ansible.builtin.command:
        argv:
          - journalctl
          - "--unit=elastic-agent.service"
          - "--no-pager"
          - "--lines=200"
      register: elastic_install_failure_logs
      changed_when: false
      failed_when: false

    - name: "Display installation failure logs"
      ansible.builtin.debug:
        var: elastic_install_failure_logs.stdout_lines

    - name: "Fail after collecting logs"
      ansible.builtin.fail:
        msg: "Elastic Agent installation failed. Review the logs above."


- name: "Display latest Elastic Agent log file"
  block:
    - name: "Find Elastic Agent log files"
      ansible.builtin.find:
        paths: /opt/Elastic/Agent/data
        patterns:
          - "elastic-agent*.ndjson"
        file_type: file
        recurse: true
      register: elastic_agent_log_files

    - name: "Select latest Elastic Agent log"
      ansible.builtin.set_fact:
        latest_elastic_agent_log: >-
          {{
            (elastic_agent_log_files.files
             | sort(attribute='mtime', reverse=true)
             | map(attribute='path')
             | first)
            | default('')
          }}

    - name: "Read latest Elastic Agent log"
      ansible.builtin.command:
        argv:
          - tail
          - "-n"
          - "100"
          - "{{ latest_elastic_agent_log }}"
      register: elastic_agent_file_log
      changed_when: false
      when: latest_elastic_agent_log | length > 0

    - name: "Display latest Elastic Agent log"
      ansible.builtin.debug:
        var: elastic_agent_file_log.stdout_lines
      when: latest_elastic_agent_log | length > 0



- name: "Start Elastic Agent service"
  block:
    - name: "Start Elastic Agent service"
      ansible.builtin.systemd:
        name: elastic-agent
        state: started
        enabled: true
      register: elastic_start

    - name: "Display Elastic Agent start status"
      ansible.builtin.debug:
        msg: "elastic-agent start : {{ 'STARTED' if elastic_start.changed else 'already running - no change' }}"


- name: "Stop Elastic Agent service"
  block:
    - name: "Stop Elastic Agent service"
      ansible.builtin.systemd:
        name: elastic-agent
        state: stopped
      register: elastic_stop

    - name: "Display Elastic Agent stop status"
      ansible.builtin.debug:
        msg: "elastic-agent stop : {{ 'STOPPED' if elastic_stop.changed else 'already stopped - no change' }}"


- name: "Restart Elastic Agent service"
  block:
    - name: "Restart Elastic Agent service"
      ansible.builtin.systemd:
        name: elastic-agent
        state: restarted
      register: elastic_restart

    - name: "Display Elastic Agent restart status"
      ansible.builtin.debug:
        msg: "elastic-agent restart : {{ 'RESTARTED' if elastic_restart.changed else 'no change' }}"


- name: "Check Elastic Agent service status"
  block:
    - name: "Get Elastic Agent systemd service status"
      ansible.builtin.systemd:
        name: elastic-agent
      register: elastic_svc_status

    - name: "Display Elastic Agent systemd status"
      ansible.builtin.debug:
        msg:
          - "state   : {{ elastic_svc_status.status.ActiveState }}"
          - "sub     : {{ elastic_svc_status.status.SubState }}"
          - "enabled : {{ elastic_svc_status.status.UnitFileState }}"

    - name: "Get Elastic Agent process status"
      ansible.builtin.command:
        argv:
          - /opt/Elastic/Agent/elastic-agent
          - status
      register: elastic_proc_status
      changed_when: false
      failed_when: false

    - name: "Display Elastic Agent process status"
      ansible.builtin.debug:
        var: elastic_proc_status.stdout_lines


- name: "Check Elastic Agent status via systemctl"
  block:
    - name: "Get Elastic Agent systemctl status"
      ansible.builtin.command:
        cmd: systemctl status elastic-agent
      register: elastic_systemctl_status
      changed_when: false
      failed_when: false

    - name: "Display Elastic Agent systemctl status"
      ansible.builtin.debug:
        var: elastic_systemctl_status.stdout_lines

        

- name: "Check files in role vars directory"
  block:
    - name: "Find files in role vars directory"
      ansible.builtin.find:
        paths: "{{ role_path }}/vars"
        file_type: file
      register: vars_dir_files
      delegate_to: localhost

    - name: "Display files in role vars directory"
      ansible.builtin.debug:
        msg:
          - "path : {{ item.path }}"
          - "size : {{ item.size }} bytes"
          - "mode : {{ item.mode }}"
      loop: "{{ vars_dir_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"


- name: "Load Elastic Agent secrets"
  block:
    - name: "Show role location"
      ansible.builtin.debug:
        msg: "Elastic Agent role path: {{ role_path }}"



    - name: "Load encrypted Elastic Agent secrets"
      ansible.builtin.include_vars:
        file: "{{ role_path }}/vars/secrets.yml"
      no_log: true
  tags:
    - always


#elastic_agent_installed_exe: 'C:\Program Files\Elastic\Agent\elastic-agent.exe'
#elastic_agent_stage_dir: 'C:\ProgramData\Elastic\Installer'



- name: "Install Elastic Agent on Windows"
  block:
    - name: "Create Elastic Agent staging directory"
      ansible.windows.win_file:
        path: "{{ elastic_agent_stage_dir }}"
        state: directory

    - name: "Download Elastic Agent ZIP"
      ansible.windows.win_get_url:
        url: "{{ elastic_agent_download_url }}"
        dest: "{{ elastic_agent_stage_dir }}\\{{ elastic_agent_archive }}"
        validate_certs: true
        force: false
      register: elastic_agent_download

    - name: "Display Elastic Agent download status"
      ansible.builtin.debug:
        msg: "zip file download : {{ 'DOWNLOADED' if elastic_agent_download.changed else 'already present - no change' }}"     

    - name: "Check whether archive is extracted"
      ansible.windows.win_stat:
        path: "{{ elastic_agent_extract_dir }}\\elastic-agent.exe"
      register: elastic_agent_extracted

    - name: "Extract Elastic Agent ZIP"
      ansible.windows.win_powershell:
        script: |
          param (
              [string] $Archive,
              [string] $Destination
          )

          $Ansible.Changed = $true

          Expand-Archive `
            -LiteralPath $Archive `
            -DestinationPath $Destination `
            -Force
        parameters:
          Archive: "{{ elastic_agent_stage_dir }}\\{{ elastic_agent_archive }}"
          Destination: "{{ elastic_agent_stage_dir }}"
      when: not elastic_agent_extracted.stat.exists

      

- name: "Install and enroll Elastic Agent on Windows"
  block:
    - name: "Install and enroll Elastic Agent"
      ansible.windows.win_command: >-
        "{{ elastic_agent_extract_dir }}\elastic-agent.exe"
        install
        --url="{{ fleet_server_url }}"
        --enrollment-token="{{ vault_fleet_enrollment_token }}"
        --non-interactive
      register: elastic_agent_install
      no_log: true

    - name: "Display Elastic Agent enrollment status"
      ansible.builtin.debug:
        msg: "enrollment : {{ 'COMPLETED' if elastic_agent_install.changed else 'already enrolled - no change' }}"


- name: "Verify Elastic Agent service on Windows"
  block:
    - name: "Ensure Elastic Agent service is automatic and running"
      ansible.windows.win_service:
        name: "Elastic Agent"
        start_mode: auto
        state: started
      register: elastic_svc_windows

    - name: "Display Elastic Agent service status"
      ansible.builtin.debug:
        msg: "elastic-agent service : {{ 'STARTED' if elastic_svc_windows.changed else 'already running - no change' }}"

    - name: "Get Elastic Agent version"
      ansible.windows.win_command: >-
        "{{ elastic_agent_installed_exe }}" version
      register: elastic_agent_version_result
      changed_when: false

    - name: "Display installed version"
      ansible.builtin.debug:
        var: elastic_agent_version_result.stdout_lines


- name: "Check Elastic Agent status on Windows"
  block:
    - name: "Check Elastic Agent status"
      ansible.windows.win_command: >-
        "{{ elastic_agent_installed_exe }}" status
      register: elastic_agent_win_status
      changed_when: false
      failed_when: false

    - name: "Display Elastic Agent status"
      ansible.builtin.debug:
        var: elastic_agent_win_status.stdout_lines


- name: "Start Elastic Agent service on Windows"
  block:
    - name: "Start Elastic Agent service"
      ansible.windows.win_service:
        name: "Elastic Agent"
        state: started
      register: elastic_win_start

    - name: "Display Elastic Agent start status"
      ansible.builtin.debug:
        msg: "elastic-agent start : {{ 'STARTED' if elastic_win_start.changed else 'already running - no change' }}"


- name: "Stop Elastic Agent service on Windows"
  block:
    - name: "Stop Elastic Agent service"
      ansible.windows.win_service:
        name: "Elastic Agent"
        state: stopped
      register: elastic_win_stop

    - name: "Display Elastic Agent stop status"
      ansible.builtin.debug:
        msg: "elastic-agent stop : {{ 'STOPPED' if elastic_win_stop.changed else 'already stopped - no change' }}"


- name: "Restart Elastic Agent service on Windows"
  block:
    - name: "Restart Elastic Agent service"
      ansible.windows.win_service:
        name: "Elastic Agent"
        state: restarted
      register: elastic_win_restart

    - name: "Display Elastic Agent restart status"
      ansible.builtin.debug:
        msg: "elastic-agent restart : {{ 'RESTARTED' if elastic_win_restart.changed else 'no change' }}"