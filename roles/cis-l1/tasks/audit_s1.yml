- name: "Audit | Section 1 Summary Header"
  ansible.builtin.debug:
    msg:
      - "===== Section 1 | Initial Setup - Audit Summary ====="
      - "Total : {{ s1_results | length }}"
      - "PASS  : {{ s1_results | selectattr('status', 'eq', 'PASS') | list | length }}"
      - "FAIL  : {{ s1_results | selectattr('status', 'eq', 'FAIL') | list | length }}"
      - "-------------------------------------------------------"
  vars:
    s1_results: "{{ cis_audit_results | selectattr('id', 'match', '^1\\.') | list }}"

- name: "Audit | Section 1 Summary Items"
  ansible.builtin.debug:
    msg: "[{{ item.status }}]  {{ item.id }} - {{ item.title }}"
  loop: "{{ cis_audit_results | selectattr('id', 'match', '^1\\.') | list }}"
  loop_control:
    label: "{{ item.id }}"
