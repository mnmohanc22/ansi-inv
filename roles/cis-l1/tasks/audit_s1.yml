---
# Section 1 | Initial Setup - Audit Checks
# CIS Red Hat Enterprise Linux 9 Benchmark v2.0.0 L1

# 1.1.1.1
- name: "Audit | 1.1.1.1 Ensure cramfs kernel module is not available"
  ansible.builtin.shell: |
    l_output="" l_output2="" l_dl=""
    l_mod_name="cramfs"; l_mod_type="fs"
    l_mod_path="$(readlink -f /lib/modules/**/kernel/$l_mod_type | sort -u)"
    f_module_chk() {
      l_dl="y"
      a_showconfig=()
      while IFS= read -r l_showconfig; do
        a_showconfig+=("$l_showconfig")
      done < <(modprobe --showconfig | grep -P -- '\b(install|blacklist)\h+'"${l_mod_name//-/_}"'\b')
      ! lsmod | grep "$l_mod_name" &>/dev/null && l_output+=" - not loaded" || l_output2+=" - loaded"
      grep -Pq '\binstall\h+'"${l_mod_name//-/_}"'\h+\/bin\/(true|false)\b' <<< "${a_showconfig[*]}" && \
        l_output+=" - not loadable" || l_output2+=" - loadable"
      grep -Pq '\bblacklist\h+'"${l_mod_name//-/_}"'\b' <<< "${a_showconfig[*]}" && \
        l_output+=" - deny listed" || l_output2+=" - not deny listed"
    }
    for l_mod_base_directory in $l_mod_path; do
      [ -d "$l_mod_base_directory/${l_mod_name/-/\/}" ] && [ -n "$(ls -A $l_mod_base_directory/${l_mod_name/-/\/})" ] && \
        [ "$l_dl" != "y" ] && f_module_chk
    done
    [ -z "$l_output2" ] && echo "PASS" || echo "FAIL"
  register: cis_1_1_1_1
  changed_when: false
  failed_when: false

- name: "Audit | 1.1.1.1 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '1.1.1.1', 'title': 'Ensure cramfs kernel module is not available', 'status': 'PASS' if 'PASS' in cis_1_1_1_1.stdout else 'FAIL'}] }}"

