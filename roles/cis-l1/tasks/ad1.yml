- name: "CIS 2.3.3 | Check configured chrony time sources"
  block:
    - name: "CIS 2.3.3 | Get configured chrony time sources"
      ansible.builtin.shell: |
        grep -Prs '^[[:space:]]*\(server\|pool\)[[:space:]]' \
          /etc/chrony.conf /etc/chrony.d/*.conf 2>/dev/null || true
      register: chrony_sources
      changed_when: false

    - name: "CIS 2.3.3 | Display configured chrony time sources"
      ansible.builtin.debug:
        var: chrony_sources.stdout_lines



- name: "CIS 2.3.3 | Check active chrony sources"
  block:
    - name: "CIS 2.3.3 | Get active chrony sources"
      ansible.builtin.command:
        cmd: chronyc sources -v
      register: chrony_active_sources
      changed_when: false
      failed_when: false

    - name: "CIS 2.3.3 | Display active chrony sources"
      ansible.builtin.debug:
        var: chrony_active_sources.stdout_lines



- name: "CIS 1.7.3 | Check remote login banner content"
  block:
    - name: "CIS 1.7.3 | Get remote login banner content"
      ansible.builtin.command:
        cmd: cat /etc/issue.net
      register: remote_banner
      changed_when: false
      failed_when: false

    - name: "CIS 1.7.3 | Display remote login banner"
      ansible.builtin.debug:
        msg: "{{ remote_banner.stdout_lines }}"


- name: "CIS 1.7.3 | Check effective SSH banner configuration"
  block:
    - name: "CIS 1.7.3 | Get effective SSH banner configuration"
      ansible.builtin.shell: |
        sshd -T | grep -i '^banner'
      register: ssh_banner
      changed_when: false
      failed_when: false

    - name: "CIS 1.7.3 | Display effective SSH banner"
      ansible.builtin.debug:
        msg: "{{ ssh_banner.stdout }}"