- name: "CIS 2.3.3 | Check configured chrony time sources"
  block:
    - name: "CIS 2.3.3 | Get configured chrony time sources"
      ansible.builtin.shell: |
        grep -Prs '^[[:space:]]*\(server\|pool\)[[:space:]]' \
          /etc/chrony.conf /etc/chrony.d/*.conf 2>/dev/null || true
      register: chrony_sources
      changed_when: false

    - name: "CIS 2.3.3 | Display configured chrony time sources"
      ansible.builtin.debug:
        var: chrony_sources.stdout_lines



- name: "CIS 2.3.3 | Check active chrony sources"
  block:
    - name: "CIS 2.3.3 | Get active chrony sources"
      ansible.builtin.command:
        cmd: chronyc sources -v
      register: chrony_active_sources
      changed_when: false
      failed_when: false

    - name: "CIS 2.3.3 | Display active chrony sources"
      ansible.builtin.debug:
        var: chrony_active_sources.stdout_lines



- name: "CIS 1.7.3 | Check remote login banner content"
  block:
    - name: "CIS 1.7.3 | Get remote login banner content"
      ansible.builtin.command:
        cmd: cat /etc/issue.net
      register: remote_banner
      changed_when: false
      failed_when: false

    - name: "CIS 1.7.3 | Display remote login banner"
      ansible.builtin.debug:
        msg: "{{ remote_banner.stdout_lines }}"


- name: "CIS 1.7.3 | Check effective SSH banner configuration"
  block:
    - name: "CIS 1.7.3 | Get effective SSH banner configuration"
      ansible.builtin.shell: |
        sshd -T | grep -i '^banner'
      register: ssh_banner
      changed_when: false
      failed_when: false

    - name: "CIS 1.7.3 | Display effective SSH banner"
      ansible.builtin.debug:
        msg: "{{ ssh_banner.stdout }}"


- name: "CIS 6.2.2.1.3 | Check systemd-journal-upload service"
  block:
    - name: "CIS 6.2.2.1.3 | Get systemd-journal-upload service status"
      ansible.builtin.command:
        cmd: systemctl status systemd-journal-upload.service
      register: journal_upload_status
      changed_when: false
      failed_when: false

    - name: "CIS 6.2.2.1.3 | Display journal upload status"
      ansible.builtin.debug:
        var: journal_upload_status.stdout_lines


- name: "CIS 6.2.2.1.3 | Configure systemd-journal-remote and upload"
  block:
    - name: "CIS 6.2.2.1.3 | Ensure systemd-journal-remote package is installed"
      ansible.builtin.dnf:
        name: systemd-journal-remote
        state: present

    - name: "CIS 6.2.2.1.3 | Enable and start journal upload"
      ansible.builtin.systemd:
        name: systemd-journal-upload.service
        masked: false
        enabled: true
        state: started



- name: "CIS 6.2.2.2 | Check journald ForwardToSyslog configuration"
  block:
    - name: "CIS 6.2.2.2 | Get journald ForwardToSyslog configuration"
      ansible.builtin.shell: |
        systemd-analyze cat-config systemd/journald.conf |
        grep -iE '^[[:space:]]*ForwardToSyslog=' || true
      register: journald_forward
      changed_when: false

    - name: "CIS 6.2.2.2 | Display ForwardToSyslog"
      ansible.builtin.debug:
        var: journald_forward.stdout_lines


- name: "CIS 6.2.2.2 | Disable forwarding journals to syslog"
  block:
    - name: "CIS 6.2.2.2 | Ensure journald drop-in directory exists"
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: "CIS 6.2.2.2 | Disable forwarding journals to syslog"
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/60-cis-forwardtosyslog.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Journal]
          ForwardToSyslog=no
      register: journald_forwardtosyslog_set

    - name: "CIS 6.2.2.2 | Restart systemd-journald to apply config"
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
      when: journald_forwardtosyslog_set.changed

    - name: "CIS 6.2.2.2 | Check systemd-journald status after restart"
      ansible.builtin.command:
        cmd: systemctl status systemd-journald
      register: journald_status
      changed_when: false
      failed_when: false
      when: journald_forwardtosyslog_set.changed

    - name: "CIS 6.2.2.2 | Display systemd-journald status"
      ansible.builtin.debug:
        var: journald_status.stdout_lines
      when: journald_forwardtosyslog_set.changed



- name: "CIS 6.1.2 | Check AIDE scheduling"
  block:
    - name: "CIS 6.1.2 | Check AIDE timers"
      ansible.builtin.shell: |
        systemctl list-timers --all | grep -i aide || true
      register: aide_timer_check
      changed_when: false

    - name: "CIS 6.1.2 | Display AIDE timers"
      ansible.builtin.debug:
        var: aide_timer_check.stdout_lines

    - name: "CIS 6.1.2 | Check scheduled AIDE cron jobs"
      ansible.builtin.shell: |
        grep -RsiE '(^|[[:space:]])aide([[:space:]]|$)' \
          /etc/crontab /etc/cron.d/ /var/spool/cron/ 2>/dev/null || true
      register: aide_cron
      changed_when: false

    - name: "CIS 6.1.2 | Display AIDE cron schedules"
      ansible.builtin.debug:
        var: aide_cron.stdout_lines


- name: "CIS 6.1.1 | Install and initialize AIDE"
  block:
    - name: "CIS 6.1.1 | Ensure AIDE is installed"
      ansible.builtin.dnf:
        name: aide
        state: present

    - name: "CIS 6.1.1 | Check for existing AIDE database"
      ansible.builtin.stat:
        path: /var/lib/aide/aide.db.gz
      register: aide_db

    - name: "CIS 6.1.1 | Initialize AIDE database"
      ansible.builtin.command:
        cmd: /usr/sbin/aide --init
      when: not aide_db.stat.exists

    - name: "CIS 6.1.1 | Activate new AIDE database"
      ansible.builtin.command:
        cmd: mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
      when: not aide_db.stat.exists

- name: "CIS 6.1.1 | Verify AIDE database"
  block:
    - name: "CIS 6.1.1 | Check AIDE database exists"
      ansible.builtin.stat:
        path: /var/lib/aide/aide.db.gz
      register: aide_db_verify

    - name: "CIS 6.1.1 | Display AIDE database status"
      ansible.builtin.debug:
        msg: "AIDE database exists: {{ aide_db_verify.stat.exists }}"


- name: "CIS 6.1.2 | Create AIDE check service"
  block:
    - name: "CIS 6.1.2 | Create aidecheck.service unit file"
      ansible.builtin.copy:
        dest: /etc/systemd/system/aidecheck.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=AIDE filesystem integrity check

          [Service]
          Type=oneshot
          ExecStart=/usr/sbin/aide --check
      register: aidecheck_service

    - name: "CIS 6.1.2 | Reload systemd to pick up aidecheck.service"
      ansible.builtin.systemd:
        daemon_reload: true
      when: aidecheck_service.changed


- name: "CIS 6.1.2 | Create daily AIDE check timer"
  block:
    - name: "CIS 6.1.2 | Create aidecheck.timer unit file"
      ansible.builtin.copy:
        dest: /etc/systemd/system/aidecheck.timer
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Run AIDE filesystem integrity check daily

          [Timer]
          OnCalendar=daily
          Persistent=true

          [Install]
          WantedBy=timers.target
      register: aidecheck_timer

    - name: "CIS 6.1.2 | Reload systemd to pick up aidecheck.timer"
      ansible.builtin.systemd:
        daemon_reload: true
      when: aidecheck_timer.changed



- name: "CIS 6.1.2 | Enable and verify AIDE timer"
  block:
    - name: "CIS 6.1.2 | Enable and start AIDE timer"
      ansible.builtin.systemd:
        name: aidecheck.timer
        enabled: true
        state: started

    - name: "CIS 6.1.2 | Get AIDE timer status"
      ansible.builtin.command:
        cmd: systemctl status aidecheck.timer
      register: aide_timer_status
      changed_when: false
      failed_when: false

    - name: "CIS 6.1.2 | Display AIDE timer status"
      ansible.builtin.debug:
        var: aide_timer_status.stdout_lines