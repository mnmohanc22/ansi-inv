- name: "CIS 1.2.1.2 | Remove pbis.repo backup files"
  block:
    - name: "CIS 1.2.1.2 | Find pbis.repo backup files"
      ansible.builtin.find:
        paths: /etc/yum.repos.d
        patterns:
          - "pbis.repo.*"
        file_type: file
        recurse: false
      register: pbis_repo_backups

    - name: "CIS 1.2.1.2 | Display pbis.repo backup files found"
      ansible.builtin.debug:
        msg: "files found : {{ pbis_repo_backups.files | map(attribute='path') | list }}"

    - name: "CIS 1.2.1.2 | Remove pbis.repo backup files"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ pbis_repo_backups.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: pbis_remove

    - name: "CIS 1.2.1.2 | Display pbis.repo backup removal status"
      ansible.builtin.debug:
        msg: "removed : {{ item.item.path }}"
      loop: "{{ pbis_remove.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: item.changed | default(false)



- name: "CIS 1.2.1.2 | Check pbis.repo gpgcheck setting"
  block:
    - name: "CIS 1.2.1.2 | Get pbis.repo gpgcheck setting"
      ansible.builtin.shell: |
        echo "=== File ==="
        ls -l /etc/yum.repos.d/pbis.repo 2>/dev/null || true

        echo "=== gpgcheck ==="
        grep -nEi '^[[:space:]]*gpgcheck[[:space:]]*=' \
          /etc/yum.repos.d/pbis.repo 2>/dev/null || true
      register: pbis_gpgcheck
      changed_when: false
      failed_when: false

    - name: "CIS 1.2.1.2 | Display pbis.repo gpgcheck"
      ansible.builtin.debug:
        var: pbis_gpgcheck.stdout_lines

    - name: "CIS 1.2.1.2 | Get pbis.repo file content"
      ansible.builtin.command:
        cmd: cat /etc/yum.repos.d/pbis.repo
      register: pbis_repo_content
      changed_when: false
      failed_when: false

    - name: "CIS 1.2.1.2 | Display pbis.repo content"
      ansible.builtin.debug:
        msg: "{{ pbis_repo_content.stdout_lines | default(['file not found']) }}"





- name: "CIS 1.2.1.2 | Enable gpgcheck in all repository files"
  block:
    - name: "CIS 1.2.1.2 | Find repository files"
      ansible.builtin.find:
        paths: /etc/yum.repos.d
        patterns:
          - "*.repo"
          - "*.repo.*"
        file_type: file
        recurse: false
      register: repo_files

    - name: "CIS 1.2.1.2 | Display repository files found"
      ansible.builtin.debug:
        msg: "{{ repo_files.files | map(attribute='path') | list }}"

    - name: "CIS 1.2.1.2 | Enable gpgcheck in all repository files"
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '^([ \t]*gpgcheck[ \t]*=[ \t]*)0([ \t]*(?:#.*)?)$'
        replace: '\g<1>1\g<2>'
        backup: false
      loop: "{{ repo_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: gpgcheck_update

    - name: "CIS 1.2.1.2 | Display updated repository files"
      ansible.builtin.debug:
        msg: "gpgcheck updated : {{ item.item.path }}"
      loop: "{{ gpgcheck_update.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: item.changed | default(false)



- name: "CIS 1.2.1.2 | Remove dnf/yum config backup files with gpgcheck=0"
  block:
    - name: "CIS 1.2.1.2 | Find dnf.conf and yum.conf backup files"
      ansible.builtin.find:
        paths:
          - /etc/dnf
          - /etc
        patterns:
          - "dnf.conf.*"
          - "dnf.conf~"
          - "yum.conf.*"
          - "yum.conf~"
        file_type: file
        recurse: false
      register: gpg_config_backups

    - name: "CIS 1.2.1.2 | Check backup files for gpgcheck=0"
      ansible.builtin.shell: |
        grep -HnE '^[[:space:]]*gpgcheck[[:space:]]*=[[:space:]]*0([[:space:]]*(#.*)?)?$' \
          "{{ item.path }}"
      loop: "{{ gpg_config_backups.files }}"
      register: gpgcheck_backup_results
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item.path }}"

    - name: "CIS 1.2.1.2 | Display backup files containing gpgcheck=0"
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ gpgcheck_backup_results.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: item.rc == 0

    - name: "CIS 1.2.1.2 | Remove backup files containing gpgcheck=0"
      ansible.builtin.file:
        path: "{{ item.item.path }}"
        state: absent
      loop: "{{ gpgcheck_backup_results.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when:
        - item.rc == 0
        - item.stdout_lines | length > 0



- name: "CIS 5.1.2 | Check SSH private host key permissions"
  block:
    - name: "CIS 5.1.2 | Find SSH private host key files"
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: "ssh_host_*_key"
        file_type: file
        recurse: false
      register: ssh_private_host_keys

    - name: "CIS 5.1.2 | Display SSH private host key permissions"
      ansible.builtin.debug:
        msg: >-
          {{ item.path }} mode={{ item.mode }}
          owner={{ item.pw_name }}
          group={{ item.gr_name }}
      loop: "{{ ssh_private_host_keys.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: "CIS 5.1.2 | Verify SSH private host key permissions"
      ansible.builtin.shell: |
        find /etc/ssh -maxdepth 1 -type f -name 'ssh_host_*_key' \
          -printf '%m %u %g %p\n'
      register: ssh_private_key_verify
      changed_when: false

    - name: "CIS 5.1.2 | Display verification"
      ansible.builtin.debug:
        var: ssh_private_key_verify.stdout_lines

- name: "CIS 5.1.2 | Configure SSH private host key permissions"
  block:
    - name: "CIS 5.1.2 | Find SSH private host key files"
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: "ssh_host_*_key"
        file_type: file
        recurse: false
      register: ssh_private_host_keys

    - name: "CIS 5.1.2 | Display SSH private host key permissions"
      ansible.builtin.debug:
        msg: >-
          {{ item.path }} mode={{ item.mode }}
          owner={{ item.pw_name }}
          group={{ item.gr_name }}
      loop: "{{ ssh_private_host_keys.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: "CIS 5.1.2 | Set SSH private host key permissions"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: '0600'
      loop: "{{ ssh_private_host_keys.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: ssh_private_key_chmod

    - name: "CIS 5.1.2 | Display changed private host key files"
      ansible.builtin.debug:
        msg: "permissions updated : {{ item.item.path }}"
      loop: "{{ ssh_private_key_chmod.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: item.changed | default(false)

