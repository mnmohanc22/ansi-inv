- name: "CIS 1.2.1.2 | Remove pbis.repo backup files"
  block:
    - name: "CIS 1.2.1.2 | Find pbis.repo backup files"
      ansible.builtin.find:
        paths: /etc/yum.repos.d
        patterns:
          - "pbis.repo.*"
        file_type: file
        recurse: false
      register: pbis_repo_backups

    - name: "CIS 1.2.1.2 | Display pbis.repo backup files found"
      ansible.builtin.debug:
        msg: "files found : {{ pbis_repo_backups.files | map(attribute='path') | list }}"

    - name: "CIS 1.2.1.2 | Remove pbis.repo backup files"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ pbis_repo_backups.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: pbis_remove

    - name: "CIS 1.2.1.2 | Display pbis.repo backup removal status"
      ansible.builtin.debug:
        msg: "removed : {{ item.item.path }}"
      loop: "{{ pbis_remove.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: item.changed | default(false)



- name: "CIS 1.2.1.2 | Check pbis.repo gpgcheck setting"
  block:
    - name: "CIS 1.2.1.2 | Get pbis.repo gpgcheck setting"
      ansible.builtin.shell: |
        echo "=== File ==="
        ls -l /etc/yum.repos.d/pbis.repo 2>/dev/null || true

        echo "=== gpgcheck ==="
        grep -nEi '^[[:space:]]*gpgcheck[[:space:]]*=' \
          /etc/yum.repos.d/pbis.repo 2>/dev/null || true
      register: pbis_gpgcheck
      changed_when: false
      failed_when: false

    - name: "CIS 1.2.1.2 | Display pbis.repo gpgcheck"
      ansible.builtin.debug:
        var: pbis_gpgcheck.stdout_lines

    - name: "CIS 1.2.1.2 | Get pbis.repo file content"
      ansible.builtin.command:
        cmd: cat /etc/yum.repos.d/pbis.repo
      register: pbis_repo_content
      changed_when: false
      failed_when: false

    - name: "CIS 1.2.1.2 | Display pbis.repo content"
      ansible.builtin.debug:
        msg: "{{ pbis_repo_content.stdout_lines | default(['file not found']) }}"





- name: "CIS 1.2.1.2 | Enable gpgcheck in all repository files"
  block:
    - name: "CIS 1.2.1.2 | Find repository files"
      ansible.builtin.find:
        paths: /etc/yum.repos.d
        patterns:
          - "*.repo"
          - "*.repo.*"
        file_type: file
        recurse: false
      register: repo_files

    - name: "CIS 1.2.1.2 | Display repository files found"
      ansible.builtin.debug:
        msg: "{{ repo_files.files | map(attribute='path') | list }}"

    - name: "CIS 1.2.1.2 | Enable gpgcheck in all repository files"
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '^([ \t]*gpgcheck[ \t]*=[ \t]*)0([ \t]*(?:#.*)?)$'
        replace: '\g<1>1\g<2>'
        backup: false
      loop: "{{ repo_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: gpgcheck_update

    - name: "CIS 1.2.1.2 | Display updated repository files"
      ansible.builtin.debug:
        msg: "gpgcheck updated : {{ item.item.path }}"
      loop: "{{ gpgcheck_update.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: item.changed | default(false)



- name: "CIS 1.2.1.2 | Remove dnf/yum config backup files with gpgcheck=0"
  block:
    - name: "CIS 1.2.1.2 | Find dnf.conf and yum.conf backup files"
      ansible.builtin.find:
        paths:
          - /etc/dnf
          - /etc
        patterns:
          - "dnf.conf.*"
          - "dnf.conf~"
          - "yum.conf.*"
          - "yum.conf~"
        file_type: file
        recurse: false
      register: gpg_config_backups

    - name: "CIS 1.2.1.2 | Check backup files for gpgcheck=0"
      ansible.builtin.shell: |
        grep -HnE '^[[:space:]]*gpgcheck[[:space:]]*=[[:space:]]*0([[:space:]]*(#.*)?)?$' \
          "{{ item.path }}"
      loop: "{{ gpg_config_backups.files }}"
      register: gpgcheck_backup_results
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item.path }}"

    - name: "CIS 1.2.1.2 | Display backup files containing gpgcheck=0"
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ gpgcheck_backup_results.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: item.rc == 0

    - name: "CIS 1.2.1.2 | Remove backup files containing gpgcheck=0"
      ansible.builtin.file:
        path: "{{ item.item.path }}"
        state: absent
      loop: "{{ gpgcheck_backup_results.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when:
        - item.rc == 0
        - item.stdout_lines | length > 0



- name: "CIS 5.1.2 | Check SSH private host key permissions"
  block:
    - name: "CIS 5.1.2 | Find SSH private host key files"
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: "ssh_host_*_key"
        file_type: file
        recurse: false
      register: ssh_private_host_keys

    - name: "CIS 5.1.2 | Display SSH private host key permissions"
      ansible.builtin.debug:
        msg: >-
          {{ item.path }} mode={{ item.mode }}
          owner={{ item.pw_name }}
          group={{ item.gr_name }}
      loop: "{{ ssh_private_host_keys.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: "CIS 5.1.2 | Verify SSH private host key permissions"
      ansible.builtin.shell: |
        find /etc/ssh -maxdepth 1 -type f -name 'ssh_host_*_key' \
          -printf '%m %u %g %p\n'
      register: ssh_private_key_verify
      changed_when: false

    - name: "CIS 5.1.2 | Display verification"
      ansible.builtin.debug:
        var: ssh_private_key_verify.stdout_lines

- name: "CIS 5.1.2 | Configure SSH private host key permissions"
  block:
    - name: "CIS 5.1.2 | Find SSH private host key files"
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: "ssh_host_*_key"
        file_type: file
        recurse: false
      register: ssh_private_host_keys

    - name: "CIS 5.1.2 | Display SSH private host key permissions"
      ansible.builtin.debug:
        msg: >-
          {{ item.path }} mode={{ item.mode }}
          owner={{ item.pw_name }}
          group={{ item.gr_name }}
      loop: "{{ ssh_private_host_keys.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: "CIS 5.1.2 | Set SSH private host key permissions"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: '0600'
      loop: "{{ ssh_private_host_keys.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: ssh_private_key_chmod

    - name: "CIS 5.1.2 | Display changed private host key files"
      ansible.builtin.debug:
        msg: "permissions updated : {{ item.item.path }}"
      loop: "{{ ssh_private_key_chmod.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: item.changed | default(false)


- name: "CIS 2.3.2 | Check Chrony sources and configuration"
  block:
    - name: "CIS 2.3.2 | Show Chrony runtime sources with DNS"
      ansible.builtin.command:
        cmd: chronyc sources -v
      register: chrony_sources_dns
      changed_when: false
      failed_when: false

    - name: "CIS 2.3.2 | Display Chrony runtime sources with DNS"
      ansible.builtin.debug:
        var: chrony_sources_dns.stdout_lines

    - name: "CIS 2.3.2 | Show Chrony runtime sources without DNS resolution"
      ansible.builtin.command:
        cmd: chronyc sources -n
      register: chrony_sources_ip
      changed_when: false
      failed_when: false

    - name: "CIS 2.3.2 | Display Chrony runtime source IPs"
      ansible.builtin.debug:
        var: chrony_sources_ip.stdout_lines

    - name: "CIS 2.3.2 | Check configured Chrony sources and source directories"
      ansible.builtin.shell: |
        grep -RHnE \
          '^[[:space:]]*(server|pool|peer|sourcedir|include|confdir)[[:space:]]+' \
          /etc/chrony.conf \
          /etc/chrony.d/ 2>/dev/null || true
      register: chrony_config_sources
      changed_when: false

    - name: "CIS 2.3.2 | Display Chrony source configuration"
      ansible.builtin.debug:
        var: chrony_config_sources.stdout_lines



- name: "CIS 2.3.2 | Check dynamic Chrony DHCP source directory"
  block:
    - name: "CIS 2.3.2 | Stat dynamic Chrony DHCP source directory"
      ansible.builtin.stat:
        path: /run/chrony-dhcp
      register: chrony_dhcp_dir

    - name: "CIS 2.3.2 | Display dynamic Chrony sources"
      ansible.builtin.shell: |
        find /run/chrony-dhcp -maxdepth 1 -type f -print -exec cat {} \;
      register: chrony_dhcp_sources
      changed_when: false
      failed_when: false
      when: chrony_dhcp_dir.stat.exists

    - name: "CIS 2.3.2 | Show dynamic Chrony sources"
      ansible.builtin.debug:
        var: chrony_dhcp_sources.stdout_lines
      when: chrony_dhcp_dir.stat.exists


- name: "CIS 2.3.2 | Check for AWS Time Sync Service"
  block:
    - name: "CIS 2.3.2 | Get AWS Time Sync Service status"
      ansible.builtin.shell: |
        chronyc sources -n | grep -F '169.254.169.123' || true
      register: aws_time_sync
      changed_when: false

    - name: "CIS 2.3.2 | Display AWS Time Sync status"
      ansible.builtin.debug:
        msg: >-
          {{
            'AWS Time Sync Service detected: ' ~ aws_time_sync.stdout
            if aws_time_sync.stdout | length > 0
            else 'AWS Time Sync Service 169.254.169.123 not detected'
          }}

- name: "CIS 2.3.2 | Check Chrony server entries in configuration"
  block:
    - name: "CIS 2.3.2 | Get server entries from Chrony configuration"
      ansible.builtin.shell: |
        grep -RHnE '^[[:space:]]*server[[:space:]]+' \
          /etc/chrony.conf \
          /etc/chrony.d/*.conf 2>/dev/null || true
      register: chrony_server_entries
      changed_when: false

    - name: "CIS 2.3.2 | Display Chrony server entries"
      ansible.builtin.debug:
        var: chrony_server_entries.stdout_lines          


- name: "CIS 1.4.1 | Determine boot mode"
  block:
    - name: "CIS 1.4.1 | Check UEFI or BIOS boot mode"
      ansible.builtin.shell: |
        if [ -d /sys/firmware/efi ]; then
          echo "UEFI"
        else
          echo "BIOS"
        fi
      register: boot_mode
      changed_when: false

    - name: "CIS 1.4.1 | Display boot mode"
      ansible.builtin.debug:
        msg: "Boot mode: {{ boot_mode.stdout }}"        

- name: "CIS 1.4.1 | Check GRUB2_PASSWORD entry"
  block:
    - name: "CIS 1.4.1 | Check GRUB2_PASSWORD PBKDF2 SHA512 entry"
      ansible.builtin.shell: |
        if grep -qE '^[[:space:]]*GRUB2_PASSWORD=grub\.pbkdf2\.sha512\.' \
          /boot/grub2/user.cfg; then
          echo "GRUB2_PASSWORD PBKDF2 SHA512 entry found"
        else
          echo "GRUB2_PASSWORD entry NOT found"
          exit 1
        fi
      register: grub_password_check
      changed_when: false
      failed_when: false

    - name: "CIS 1.4.1 | Display GRUB2_PASSWORD check result"
      ansible.builtin.debug:
        msg: "{{ grub_password_check.stdout }}"        