- name: "CIS 4.2.2 | Verify effective loopback rules"
  block:
    - name: "CIS 4.2.2 | Get effective loopback rules"
      ansible.builtin.shell: |
        echo "===== Loopback interface ====="
        firewall-cmd --get-zone-of-interface=lo

        echo
        echo "===== IPv4 ====="
        nft list ruleset |
          grep -Ei '127\.0\.0\.0/8|127\.0\.0\.1'

        echo
        echo "===== IPv6 ====="
        nft list ruleset |
          grep -Ei '::1' || true
      register: loopback_verify
      changed_when: false

    - name: "CIS 4.2.2 | Display loopback verification"
      ansible.builtin.debug:
        var: loopback_verify.stdout_lines

- name: "CIS 7.1.11 | Audit world writable files and directories"
  block:
    - name: "CIS 7.1.11 | Find world writable files"
      ansible.builtin.shell: |
        findmnt -rn -o TARGET,FSTYPE |
        awk '$2 ~ /^(ext2|ext3|ext4|xfs)$/ {print $1}' |
        while read -r mount; do
          find "$mount" -xdev -type f -perm -0002 -print 2>/dev/null
        done | sort -u
      register: world_writable_files
      changed_when: false

    - name: "CIS 7.1.11 | Find world writable directories without sticky bit"
      ansible.builtin.shell: |
        findmnt -rn -o TARGET,FSTYPE |
        awk '$2 ~ /^(ext2|ext3|ext4|xfs)$/ {print $1}' |
        while read -r mount; do
          find "$mount" -xdev -type d -perm -0002 ! -perm -1000 \
            -print 2>/dev/null
        done | sort -u
      register: world_writable_dirs
      changed_when: false

    - name: "CIS 7.1.11 | Display world writable files"
      ansible.builtin.debug:
        var: world_writable_files.stdout_lines

    - name: "CIS 7.1.11 | Display world writable directories without sticky bit"
      ansible.builtin.debug:
        var: world_writable_dirs.stdout_lines


- name: "CIS 7.1.11 | Audit world writable files under systemd private tmp"
  block:
    - name: "CIS 7.1.11 | Find world writable files under systemd private tmp"
      ansible.builtin.shell: |
        find /tmp/systemd-private-* \
          -type f \
          -perm -0002 \
          -exec stat -Lc '%a %U %G %n' {} \; \
          2>/dev/null || true
      register: systemd_private_world_writable
      changed_when: false
      become: true

    - name: "CIS 7.1.11 | Display systemd private tmp findings"
      ansible.builtin.debug:
        var: systemd_private_world_writable.stdout_lines

- name: "CIS 7.1.11 | Search systemd private tmp recursively"
  block:
    - name: "CIS 7.1.11 | Get all files under systemd private tmp"
      ansible.builtin.shell: |
        find /tmp/systemd-private-* \
          -type f \
          -printf '%m %u %g %p\n' \
          2>/dev/null || true
      register: private_tmp_files
      changed_when: false
      become: true

    - name: "CIS 7.1.11 | Display private tmp files"
      ansible.builtin.debug:
        var: private_tmp_files.stdout_lines



- name: "CIS 4.2.2 | Configure loopback anti-spoofing rules"
  block:
    - name: "CIS 4.2.2 | Add loopback interface to trusted zone"
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone=trusted
          - --add-interface=lo
      register: lo_trusted
      changed_when: "'ALREADY_ENABLED' not in lo_trusted.stderr"

    - name: "CIS 4.2.2 | Add IPv4 loopback anti-spoofing rule"
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - '--add-rich-rule=rule family="ipv4" source address="127.0.0.1" destination not address="127.0.0.1" drop'
      register: ipv4_loopback
      changed_when: "'ALREADY_ENABLED' not in ipv4_loopback.stderr"

    - name: "CIS 4.2.2 | Add IPv4 loopback anti-spoofing rule to trusted zone"
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone=trusted
          - '--add-rich-rule=rule family="ipv4" source address="127.0.0.1" destination not address="127.0.0.1" drop'
      register: ipv4_loopback_trusted
      changed_when: "'ALREADY_ENABLED' not in ipv4_loopback_trusted.stderr"

    - name: "CIS 4.2.2 | Add IPv6 loopback anti-spoofing rule"
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - '--add-rich-rule=rule family="ipv6" source address="::1" destination not address="::1" drop'
      register: ipv6_loopback
      changed_when: "'ALREADY_ENABLED' not in ipv6_loopback.stderr"

    - name: "CIS 4.2.2 | Add IPv6 loopback anti-spoofing rule to trusted zone"
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone=trusted
          - '--add-rich-rule=rule family="ipv6" source address="::1" destination not address="::1" drop'
      register: ipv6_loopback_trusted
      changed_when: "'ALREADY_ENABLED' not in ipv6_loopback_trusted.stderr"

    - name: "CIS 4.2.2 | Reload firewalld"
      ansible.builtin.command:
        cmd: firewall-cmd --reload
      when: >
        lo_trusted.changed or
        ipv4_loopback.changed or
        ipv4_loopback_trusted.changed or
        ipv6_loopback.changed or
        ipv6_loopback_trusted.changed
