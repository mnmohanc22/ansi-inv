# 7.1.11
- name: "Audit | 7.1.11 Ensure world writable files and directories are secured"
  ansible.builtin.shell: |
    count=$(find / -xdev -type f -perm -0002 2>/dev/null | grep -v '/proc/' | grep -v '/sys/' | wc -l)
    [ "$count" -eq 0 ] && echo "PASS" || echo "FAIL: $count world-writable files found"
  register: cis_7_1_11
  changed_when: false
  failed_when: false

- name: "Audit | 7.1.11 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '7.1.11', 'title': 'Ensure world writable files and directories are secured', 'status': 'PASS' if 'PASS' in cis_7_1_11.stdout else 'FAIL'}] }}"

# 7.1.12
- name: "Audit | 7.1.12 Ensure no files or directories without an owner and a group exist"
  ansible.builtin.shell: |
    count=$(find / -xdev \( -nouser -o -nogroup \) 2>/dev/null | grep -v '/proc/' | grep -v '/sys/' | wc -l)
    [ "$count" -eq 0 ] && echo "PASS" || echo "FAIL: $count unowned files found"
  register: cis_7_1_12
  changed_when: false
  failed_when: false

- name: "Audit | 7.1.12 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '7.1.12', 'title': 'Ensure no files or directories without an owner and a group exist', 'status': 'PASS' if 'PASS' in cis_7_1_12.stdout else 'FAIL'}] }}"

# 7.2.1
- name: "Audit | 7.2.1 Ensure accounts in /etc/passwd use shadowed passwords"
  ansible.builtin.shell: |
    count=$(awk -F: '($2 != "x") {print $1}' /etc/passwd | wc -l)
    [ "$count" -eq 0 ] && echo "PASS" || echo "FAIL: $count accounts not using shadow passwords"
  register: cis_7_2_1
  changed_when: false
  failed_when: false

- name: "Audit | 7.2.1 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '7.2.1', 'title': 'Ensure accounts in /etc/passwd use shadowed passwords', 'status': 'PASS' if 'PASS' in cis_7_2_1.stdout else 'FAIL'}] }}"

# 7.2.2
- name: "Audit | 7.2.2 Ensure /etc/shadow password fields are not empty"
  ansible.builtin.shell: |
    count=$(awk -F: '($2 == "") {print $1}' /etc/shadow | wc -l)
    [ "$count" -eq 0 ] && echo "PASS" || echo "FAIL: $count accounts with empty passwords"
  register: cis_7_2_2
  changed_when: false
  failed_when: false

- name: "Audit | 7.2.2 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '7.2.2', 'title': 'Ensure /etc/shadow password fields are not empty', 'status': 'PASS' if 'PASS' in cis_7_2_2.stdout else 'FAIL'}] }}"

# 7.2.3
- name: "Audit | 7.2.3 Ensure all groups in /etc/passwd exist in /etc/group"
  ansible.builtin.shell: |
    missing=0
    for gid in $(cut -s -d: -f4 /etc/passwd | sort -u); do
      grep -Pq "^.*:.*:${gid}:" /etc/group || missing=$((missing+1))
    done
    [ "$missing" -eq 0 ] && echo "PASS" || echo "FAIL: $missing missing groups"
  register: cis_7_2_3
  changed_when: false
  failed_when: false

- name: "Audit | 7.2.3 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '7.2.3', 'title': 'Ensure all groups in /etc/passwd exist in /etc/group', 'status': 'PASS' if 'PASS' in cis_7_2_3.stdout else 'FAIL'}] }}"

# 7.2.4
- name: "Audit | 7.2.4 Ensure no duplicate UIDs exist"
  ansible.builtin.shell: |
    count=$(cut -f3 -d: /etc/passwd | sort -n | uniq -d | wc -l)
    [ "$count" -eq 0 ] && echo "PASS" || echo "FAIL: $count duplicate UIDs"
  register: cis_7_2_4
  changed_when: false
  failed_when: false

- name: "Audit | 7.2.4 Set result"
