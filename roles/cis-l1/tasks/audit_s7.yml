# 7.2.8
- name: "Audit | 7.2.8 Ensure local interactive user home directories are configured"
  ansible.builtin.shell: |
    fail=0
    while IFS=: read -r user _ uid _ _ home _; do
      [ "$uid" -ge 1000 ] && [ "$user" != "nobody" ] && [ ! -d "$home" ] && fail=$((fail+1))
    done < /etc/passwd
    [ "$fail" -eq 0 ] && echo "PASS" || echo "FAIL: $fail missing home directories"
  register: cis_7_2_8
  changed_when: false
  failed_when: false

- name: "Audit | 7.2.8 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '7.2.8', 'title': 'Ensure local interactive user home directories are configured', 'status': 'PASS' if 'PASS' in cis_7_2_8.stdout else 'FAIL'}] }}"

# 7.2.9
- name: "Audit | 7.2.9 Ensure local interactive user dot files access is configured"
  ansible.builtin.shell: |
    fail=0
    while IFS=: read -r user _ uid _ _ home _; do
      if [ "$uid" -ge 1000 ] && [ "$user" != "nobody" ] && [ -d "$home" ]; then
        find "$home" -maxdepth 1 -name ".*" -perm /o+w 2>/dev/null | grep -q . && fail=$((fail+1))
      fi
    done < /etc/passwd
    [ "$fail" -eq 0 ] && echo "PASS" || echo "FAIL: $fail users with world-writable dot files"
  register: cis_7_2_9
  changed_when: false
  failed_when: false

- name: "Audit | 7.2.9 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '7.2.9', 'title': 'Ensure local interactive user dot files access is configured', 'status': 'PASS' if 'PASS' in cis_7_2_9.stdout else 'FAIL'}] }}"

- name: "Audit | Section 7 Summary Header"
  ansible.builtin.debug:
    msg:
      - "===== Section 7 | System Maintenance - Audit Summary ====="
      - "Total : {{ s7_results | length }}"
      - "PASS  : {{ s7_results | selectattr('status', 'eq', 'PASS') | list | length }}"
      - "FAIL  : {{ s7_results | selectattr('status', 'eq', 'FAIL') | list | length }}"
      - "-------------------------------------------------------"
  vars:
    s7_results: "{{ cis_audit_results | selectattr('id', 'match', '^7\\.') | list }}"

- name: "Audit | Section 7 Summary Items"
  ansible.builtin.debug:
    msg: "[{{ item.status }}]  {{ item.id }} - {{ item.title }}"
  loop: "{{ cis_audit_results | selectattr('id', 'match', '^7\\.') | list }}"
  loop_control:
    label: "{{ item.id }}"

- name: "Audit | Section 7 init summary list"
  ansible.builtin.set_fact:
    s7_summary_lines: []

- name: "Audit | Section 7 build summary lines"
  ansible.builtin.set_fact:
    s7_summary_lines: "{{ s7_summary_lines + ['[' + item.status + ']  ' + item.id + ' - ' + item.title] }}"
  loop: "{{ cis_audit_results | selectattr('id', 'match', '^7\\.') | list }}"
  loop_control:
    label: "{{ item.id }}"

- name: "Audit | Section 7 Summary Items - Single Message"
  ansible.builtin.debug:
    msg: "{{ s7_summary_lines }}"
