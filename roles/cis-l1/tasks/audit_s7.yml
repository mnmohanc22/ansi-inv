---
# Section 7 | System Maintenance - Audit Checks
# CIS Red Hat Enterprise Linux 9 Benchmark v2.0.0 L1

# 7.1.1
- name: "Audit | 7.1.1 Ensure permissions on /etc/passwd are configured"
  ansible.builtin.shell: |
    stat -c "%a %u %g" /etc/passwd | grep -Pq '^\s*644\s+0\s+0\b' && echo "PASS" || echo "FAIL"
  register: cis_7_1_1
  changed_when: false
  failed_when: false

- name: "Audit | 7.1.1 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '7.1.1', 'title': 'Ensure permissions on /etc/passwd are configured', 'status': 'PASS' if 'PASS' in cis_7_1_1.stdout else 'FAIL'}] }}"

# 7.1.2
- name: "Audit | 7.1.2 Ensure permissions on /etc/passwd- are configured"
  ansible.builtin.shell: |
    stat -c "%a %u %g" /etc/passwd- 2>/dev/null | grep -Pq '^\s*6[04][04]\s+0\s+0\b' && echo "PASS" || echo "FAIL"
  register: cis_7_1_2
  changed_when: false
  failed_when: false

- name: "Audit | 7.1.2 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '7.1.2', 'title': 'Ensure permissions on /etc/passwd- are configured', 'status': 'PASS' if 'PASS' in cis_7_1_2.stdout else 'FAIL'}] }}"

