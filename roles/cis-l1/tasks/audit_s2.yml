---
# Section 2 | Services - Audit Checks
# CIS Red Hat Enterprise Linux 9 Benchmark v2.0.0 L1

# 2.1.1
- name: "Audit | 2.1.1 Ensure autofs services are not in use"
  ansible.builtin.shell: |
    systemctl is-enabled autofs 2>/dev/null | grep -qE 'enabled' && echo "FAIL" || echo "PASS"
  register: cis_2_1_1
  changed_when: false
  failed_when: false

- name: "Audit | 2.1.1 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '2.1.1', 'title': 'Ensure autofs services are not in use', 'status': 'PASS' if 'PASS' in cis_2_1_1.stdout else 'FAIL'}] }}"

