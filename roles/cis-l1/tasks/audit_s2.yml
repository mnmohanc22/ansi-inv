- name: "Audit | Section 2 Summary Header"
  ansible.builtin.debug:
    msg:
      - "===== Section 2 | Services - Audit Summary ====="
      - "Total : {{ s2_results | length }}"
      - "PASS  : {{ s2_results | selectattr('status', 'eq', 'PASS') | list | length }}"
      - "FAIL  : {{ s2_results | selectattr('status', 'eq', 'FAIL') | list | length }}"
      - "-------------------------------------------------------"
  vars:
    s2_results: "{{ cis_audit_results | selectattr('id', 'match', '^2\\.') | list }}"

- name: "Audit | Section 2 Summary Items"
  ansible.builtin.debug:
    msg: "[{{ item.status }}]  {{ item.id }} - {{ item.title }}"
  loop: "{{ cis_audit_results | selectattr('id', 'match', '^2\\.') | list }}"
  loop_control:
    label: "{{ item.id }}"

- name: "Audit | Section 2 init summary list"
  ansible.builtin.set_fact:
    s2_summary_lines: []

- name: "Audit | Section 2 build summary lines"
  ansible.builtin.set_fact:
    s2_summary_lines: "{{ s2_summary_lines + ['[' + item.status + ']  ' + item.id + ' - ' + item.title] }}"
  loop: "{{ cis_audit_results | selectattr('id', 'match', '^2\\.') | list }}"
  loop_control:
    label: "{{ item.id }}"

- name: "Audit | Section 2 Summary Items - Single Message"
  ansible.builtin.debug:
    msg: "{{ s2_summary_lines }}"
