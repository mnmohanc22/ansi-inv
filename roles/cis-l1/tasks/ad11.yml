- name: "CIS 3.3.7 | Audit reverse path filtering"
  block:
    - name: "CIS 3.3.7 | Get reverse path filtering configuration"
      ansible.builtin.shell: |
        echo "===== Runtime values ====="
        echo "net.ipv4.conf.all.rp_filter=$(sysctl -n net.ipv4.conf.all.rp_filter)"
        echo "net.ipv4.conf.default.rp_filter=$(sysctl -n net.ipv4.conf.default.rp_filter)"

        echo
        echo "===== Persistent configuration ====="
        grep -RHnE '^[[:space:]]*net\.ipv4\.conf\.(all|default)\.rp_filter[[:space:]]*=' \
          /etc/sysctl.conf /etc/sysctl.d/*.conf 2>/dev/null || true
      register: rp_filter_audit
      changed_when: false

    - name: "CIS 3.3.7 | Display reverse path filtering configuration"
      ansible.builtin.debug:
        var: rp_filter_audit.stdout_lines


- name: "CIS 5.1.1 | Audit permissions on /etc/ssh/sshd_config"
  block:
    - name: "CIS 5.1.1 | Stat /etc/ssh/sshd_config"
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config
      register: sshd_config_stat

    - name: "CIS 5.1.1 | Display sshd_config permissions"
      ansible.builtin.debug:
        msg:
          - "Owner: {{ sshd_config_stat.stat.pw_name }}"
          - "Group: {{ sshd_config_stat.stat.gr_name }}"
          - "Mode: {{ sshd_config_stat.stat.mode }}" 

    - name: "CIS 5.1.1 | Configure permissions on /etc/ssh/sshd_config"
      ansible.builtin.file:
        path: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: '0600'


- name: "CIS 5.1.1 | Configure SSH drop-in file permissions"
  block:
    - name: "CIS 5.1.1 | Find sshd configuration drop-ins"
      ansible.builtin.find:
        paths: /etc/ssh/sshd_config.d
        file_type: file
      register: sshd_dropins

    - name: "CIS 5.1.1 | Display sshd drop-in permissions"
      ansible.builtin.debug:
        msg: >-
          {{ item.path }}
          owner={{ item.pw_name }}
          group={{ item.gr_name }}
          mode={{ item.mode }}
      loop: "{{ sshd_dropins.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: "CIS 5.1.1 | Configure SSH drop-in permissions"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: '0600'
      loop: "{{ sshd_dropins.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: sshd_dropin_chmod

    - name: "CIS 5.1.1 | Display changed drop-in files"
      ansible.builtin.debug:
        msg: "permissions updated : {{ item.item.path }}"
      loop: "{{ sshd_dropin_chmod.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: item.changed | default(false)




- name: "CIS 5.2.7 | Audit su command restriction"
  block:
    - name: "CIS 5.2.7 | Get su restriction configuration"
      ansible.builtin.shell: |
        echo "===== PAM su configuration ====="
        grep -nE '^[[:space:]]*auth[[:space:]]+(required|requisite)[[:space:]]+pam_wheel\.so' \
          /etc/pam.d/su || true

        echo
        echo "===== su restriction groups ====="
        grep -E '^(wheel|sugroup):' /etc/group || true

        echo
        echo "===== sugroup members ====="
        getent group sugroup || true
      register: su_audit
      changed_when: false

    - name: "CIS 5.2.7 | Display su restriction audit"
      ansible.builtin.debug:
        var: su_audit.stdout_lines


- name: "CIS 5.2.7 | Restrict access to su command"
  block:
    - name: "CIS 5.2.7 | Ensure su restriction group exists"
      ansible.builtin.group:
        name: sugroup
        state: present

    - name: "CIS 5.2.7 | Restrict access to su command via PAM"
      ansible.builtin.lineinfile:
        path: /etc/pam.d/su
        regexp: '^[ \t]*#?[ \t]*auth[ \t]+required[ \t]+pam_wheel\.so.*$'
        line: 'auth required pam_wheel.so use_uid group=sugroup'
        state: present
        backup: false
      register: su_pam_set

    - name: "CIS 5.2.7 | Display su PAM restriction status"
      ansible.builtin.debug:
        msg: "su PAM restriction : {{ 'CONFIGURED' if su_pam_set.changed else 'ALREADY SET' }}"    


- name: "CIS 5.4.2.5 | Audit root PATH directories"
  block:
    - name: "CIS 5.4.2.5 | Get root PATH"
      ansible.builtin.shell: |
        sudo -Hiu root env | awk -F= '$1=="PATH" {print $2}'
      register: root_path
      changed_when: false

    - name: "CIS 5.4.2.5 | Display root PATH"
      ansible.builtin.debug:
        msg: "Root PATH={{ root_path.stdout }}"

    - name: "CIS 5.4.2.5 | Audit each root PATH directory"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ root_path.stdout.split(':') }}"
      loop_control:
        label: "{{ item }}"
      register: root_path_stats
      changed_when: false

    - name: "CIS 5.4.2.5 | Display root PATH directory audit"
      ansible.builtin.debug:
        msg:
          - "Path={{ item.item }}"
          - "Exists={{ item.stat.exists | default(false) }}"
          - "Owner={{ item.stat.pw_name | default('N/A') }}"
          - "Group={{ item.stat.gr_name | default('N/A') }}"
          - "Mode={{ item.stat.mode | default('N/A') }}"
      loop: "{{ root_path_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: "CIS 5.4.2.5 | Check root PATH directory compliance"
      ansible.builtin.debug:
        msg: >-
          {{ 'PASS' if
             item.stat.exists | default(false) and
             item.stat.pw_name | default('') == 'root' and
             (item.stat.mode | default('0777') | int(base=8)) is not none
             else 'CHECK' }}
          - {{ item.item }}
          owner={{ item.stat.pw_name | default('N/A') }}
          group={{ item.stat.gr_name | default('N/A') }}
          mode={{ item.stat.mode | default('N/A') }}
      loop: "{{ root_path_stats.results }}"
      loop_control:
        label: "{{ item.item }}"


- name: "CIS 5.4.2.5 | Audit root PATH integrity"
  block:
    - name: "CIS 5.4.2.5 | Check root PATH integrity"
      ansible.builtin.shell: |
        root_path="$(sudo -Hiu root env | grep '^PATH=' | cut -d= -f2-)"

        echo "Root PATH: ${root_path}"
        echo

        errors=0

        if echo "${root_path}" | grep -q "::"; then
          echo "FAIL: PATH contains an empty directory (::)"
          errors=1
        fi

        if echo "${root_path}" | grep -q ":$"; then
          echo "FAIL: PATH contains trailing colon"
          errors=1
        fi

        oldIFS="$IFS"
        IFS=":"

        for dir in ${root_path}; do

          if [ "${dir}" = "." ]; then
            echo "FAIL: PATH contains current directory (.)"
            errors=1
            continue
          fi

          if [ ! -d "${dir}" ]; then
            echo "FAIL: ${dir} does not exist"
            errors=1
            continue
          fi

          owner=$(stat -Lc '%U' "${dir}")
          mode=$(stat -Lc '%a' "${dir}")

          if [ "${owner}" != "root" ]; then
            echo "FAIL: ${dir} owner=${owner}, expected=root"
            errors=1
          fi

          if find "${dir}" -maxdepth 0 -perm /0022 | grep -q .; then
            echo "FAIL: ${dir} is group or world writable (mode=${mode})"
            errors=1
          else
            echo "PASS: ${dir} owner=${owner} mode=${mode}"
          fi

        done

        IFS="$oldIFS"

        echo
        if [ "${errors}" -eq 0 ]; then
          echo "PASS: Root PATH integrity is compliant"
        else
          echo "FAIL: Root PATH integrity issues detected"
        fi
      register: root_path_audit
      changed_when: false

    - name: "CIS 5.4.2.5 | Display root PATH audit"
      ansible.builtin.debug:
        var: root_path_audit.stdout_lines



- name: "CIS 5.4.3.2 | Audit default user shell timeout"
  block:
    - name: "CIS 5.4.3.2 | Get shell timeout configuration"
      ansible.builtin.shell: |
        grep -PHns \
          '^[\s]*(?:readonly[\s]+)?TMOUT=(?:[1-9]|[1-8][0-9]{1,2}|900)\b|^[\s]*readonly[\s]+TMOUT\b|^[\s]*export[\s]+TMOUT\b' \
          /etc/profile /etc/bashrc /etc/profile.d/*.sh 2>/dev/null || true
      register: tmout_audit
      changed_when: false

    - name: "CIS 5.4.3.2 | Display shell timeout configuration"
      ansible.builtin.debug:
        var: tmout_audit.stdout_lines

- name: "CIS 5.4.3.2 | Find all TMOUT configurations"
  block:
    - name: "CIS 5.4.3.2 | Get all TMOUT settings"
      ansible.builtin.shell: |
        grep -PHns '^[\s]*(readonly[\s]+|export[\s]+)?TMOUT\b' \
          /etc/profile /etc/bashrc /etc/profile.d/*.sh 2>/dev/null || true
      register: tmout_all
      changed_when: false

    - name: "CIS 5.4.3.2 | Display all TMOUT settings"
      ansible.builtin.debug:
        var: tmout_all.stdout_lines


- name: "CIS 5.4.3.2 | Check effective TMOUT"
  block:
    - name: "CIS 5.4.3.2 | Get effective TMOUT value"
      ansible.builtin.shell: |
        bash -lc 'printf "TMOUT=%s\n" "${TMOUT:-NOT_SET}"'
      register: tmout_effective
      changed_when: false

    - name: "CIS 5.4.3.2 | Display effective TMOUT"
      ansible.builtin.debug:
        var: tmout_effective.stdout


- name: "CIS 5.4.3.2 | Configure default shell timeout"
  block:
    - name: "CIS 5.4.3.2 | Deploy TMOUT configuration file"
      ansible.builtin.copy:
        dest: /etc/profile.d/99-cis-tmout.sh
        owner: root
        group: root
        mode: '0644'
        content: |
          TMOUT=900
          readonly TMOUT
          export TMOUT
      register: tmout_deployed

    - name: "CIS 5.4.3.2 | Display TMOUT deploy status"
      ansible.builtin.debug:
        msg: "TMOUT config : {{ 'DEPLOYED' if tmout_deployed.changed else 'ALREADY SET' }}"

    - name: "CIS 5.4.3.2 | Verify TMOUT configuration"
      ansible.builtin.shell: |
        grep -nE '^[[:space:]]*(TMOUT=|readonly[[:space:]]+TMOUT|export[[:space:]]+TMOUT)' \
          /etc/profile.d/99-cis-tmout.sh
      register: tmout_check
      changed_when: false

    - name: "CIS 5.4.3.2 | Display TMOUT configuration"
      ansible.builtin.debug:
        var: tmout_check.stdout_lines      


- name: "CIS 5.4.3.3 | Find all configured umask values"
  block:
    - name: "CIS 5.4.3.3 | Get all configured umask values"
      ansible.builtin.shell: |
        grep -RHnE '^[[:space:]]*(umask[[:space:]]+[0-7]+|UMASK[[:space:]]+[0-7]+)' \
          /etc/profile \
          /etc/bashrc \
          /etc/profile.d/*.sh \
          /etc/login.defs 2>/dev/null || true
      register: umask_all
      changed_when: false

    - name: "CIS 5.4.3.3 | Display all umask configurations"
      ansible.builtin.debug:
        var: umask_all.stdout_lines        


- name: "CIS 6.2.2.1.1 | Check systemd-journal-remote package"
  block:
    - name: "CIS 6.2.2.1.1 | Get systemd-journal-remote package status"
      ansible.builtin.command:
        cmd: rpm -q systemd-journal-remote
      register: journal_remote_check
      changed_when: false
      failed_when: false

    - name: "CIS 6.2.2.1.1 | Display package status"
      ansible.builtin.debug:
        msg: "systemd-journal-remote : {{ 'INSTALLED' if journal_remote_check.rc == 0 else 'NOT INSTALLED' }}"
    
    - name: "CIS 6.2.2.1.1 | Ensure systemd-journal-remote is installed"
      ansible.builtin.dnf:
        name: systemd-journal-remote
        state: present
      register: journal_remote_install

    - name: "CIS 6.2.2.1.1 | Display install status"
      ansible.builtin.debug:
        msg: "systemd-journal-remote : {{ 'INSTALLED' if journal_remote_install.changed else 'ALREADY INSTALLED' }}"



- name: "CIS 6.2.2.2 | Disable journald ForwardToSyslog"
  block:
    - name: "CIS 6.2.2.2 | Audit journald ForwardToSyslog"
      ansible.builtin.shell: |
        echo "===== Configured values ====="
        grep -RHnE '^[[:space:]]*ForwardToSyslog[[:space:]]*=' \
          /etc/systemd/journald.conf \
          /etc/systemd/journald.conf.d/*.conf 2>/dev/null || true

        echo
        echo "===== Effective configuration ====="
        systemd-analyze cat-config systemd/journald.conf 2>/dev/null |
          grep -E '^[[:space:]]*ForwardToSyslog[[:space:]]*=' || true
      register: journald_forward_audit
      changed_when: false

    - name: "CIS 6.2.2.2 | Display audit result"
      ansible.builtin.debug:
        var: journald_forward_audit.stdout_lines

    - name: "CIS 6.2.2.2 | Ensure journald drop-in directory exists"
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: "CIS 6.2.2.2 | Disable ForwardToSyslog"
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/60-cis-forwardtosyslog.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Journal]
          ForwardToSyslog=no
      register: journald_forward_set

    - name: "CIS 6.2.2.2 | Restart systemd-journald to apply config"
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
      when: journald_forward_set.changed    


- name: "CIS 6.2.2.2 | Find all ForwardToSyslog settings"
  block:
    - name: "CIS 6.2.2.2 | Get all ForwardToSyslog settings"
      ansible.builtin.shell: |
        grep -RHnE '^[[:space:]]*ForwardToSyslog[[:space:]]*=' \
          /etc/systemd/journald.conf \
          /etc/systemd/journald.conf.d/*.conf \
          /usr/lib/systemd/journald.conf.d/*.conf 2>/dev/null || true
      register: forwardtosyslog_all
      changed_when: false

    - name: "CIS 6.2.2.2 | Display all ForwardToSyslog settings"
      ansible.builtin.debug:
        var: forwardtosyslog_all.stdout_lines

- name: "CIS 6.2.2.2 | Check effective ForwardToSyslog configuration"
  block:
    - name: "CIS 6.2.2.2 | Get effective ForwardToSyslog value"
      ansible.builtin.shell: |
        systemd-analyze cat-config systemd/journald.conf 2>/dev/null \
          | grep -E '^[[:space:]]*ForwardToSyslog[[:space:]]*=' || true
      register: journald_forward_all
      changed_when: false

    - name: "CIS 6.2.2.2 | Display effective ForwardToSyslog value"
      ansible.builtin.debug:
        var: journald_forward_all.stdout_lines        



- name: "CIS 7.2.8 | Check local interactive user home directories"
  block:
    - name: "CIS 7.2.8 | Get local interactive users"
      ansible.builtin.shell: |
        awk -F: '
          ($3 >= 1000 &&
           $1 != "nobody" &&
           $7 !~ /(nologin|false)$/) {
             print $1 ":" $6
          }' /etc/passwd
      register: local_interactive_users
      changed_when: false

    - name: "CIS 7.2.8 | Stat local interactive user home directories"
      ansible.builtin.stat:
        path: "{{ item.split(':')[1] }}"
      loop: "{{ local_interactive_users.stdout_lines }}"
      loop_control:
        label: "{{ item.split(':')[0] }}"
      register: user_home_stats
      changed_when: false

    - name: "CIS 7.2.8 | Display home directory configuration"
      ansible.builtin.debug:
        msg:
          - "User={{ item.item.split(':')[0] }}"
          - "Home={{ item.item.split(':')[1] }}"
          - "Exists={{ item.stat.exists | default(false) }}"
          - "Directory={{ item.stat.isdir | default(false) }}"
          - "Owner={{ item.stat.pw_name | default('N/A') }}"
          - "Group={{ item.stat.gr_name | default('N/A') }}"
          - "Mode={{ item.stat.mode | default('N/A') }}"
      loop: "{{ user_home_stats.results }}"
      loop_control:
        label: "{{ item.item.split(':')[0] }}"





- name: "CIS 7.2.8 | Remediate local interactive user home directories"
  block:
    - name: "CIS 7.2.8 | Get local interactive users"
      ansible.builtin.shell: |
        awk -F: '
          ($3 >= 1000 &&
           $1 != "nobody" &&
           $7 !~ /(nologin|false)$/) {
             print $1 ":" $6
          }' /etc/passwd
      register: local_interactive_users
      changed_when: false

    - name: "CIS 7.2.8 | Get primary group for local interactive users"
      ansible.builtin.command:
        cmd: "id -gn {{ item.split(':')[0] }}"
      loop: "{{ local_interactive_users.stdout_lines }}"
      loop_control:
        label: "{{ item.split(':')[0] }}"
      register: user_primary_groups
      changed_when: false

    - name: "CIS 7.2.8 | Configure home directory ownership and permissions"
      ansible.builtin.file:
        path: "{{ item.item.split(':')[1] }}"
        state: directory
        owner: "{{ item.item.split(':')[0] }}"
        group: "{{ item.stdout }}"
        mode: '0700'
      loop: "{{ user_primary_groups.results }}"
      loop_control:
        label: "{{ item.item.split(':')[0] }}"
      register: home_dir_chmod

    - name: "CIS 7.2.8 | Display changed home directories"
      ansible.builtin.debug:
        msg: "ownership/permissions updated : {{ item.item.item.split(':')[0] }} {{ item.item.item.split(':')[1] }}"
      loop: "{{ home_dir_chmod.results }}"
      loop_control:
        label: "{{ item.item.item.split(':')[0] }}"
      when: item.changed | default(false)



- name: "CIS 7.2.8 | List home directories"
  block:
    - name: "CIS 7.2.8 | Find all directories under /home"
      ansible.builtin.find:
        paths: /home
        file_type: directory
        recurse: false
      register: home_directories

    - name: "CIS 7.2.8 | Display home directory configuration"
      ansible.builtin.debug:
        msg: >-
          Directory={{ item.path }} |
          Owner={{ item.pw_name | default('N/A') }} |
          Group={{ item.gr_name | default('N/A') }} |
          Mode={{ item.mode | default('N/A') }}
      loop: "{{ home_directories.files }}"
      loop_control:
        label: "{{ item.path }}"






- name: "CIS 7.2.8 | Fix home directory permissions"
  block:
    - name: "CIS 7.2.8 | Display home directories to fix"
      ansible.builtin.debug:
        msg: "home_dirs_to_fix : {{ home_dirs_to_fix }}"

    - name: "CIS 7.2.8 | Set permissions on home directories"
      ansible.builtin.file:
        path: "{{ item }}"
        mode: '0700'
      loop: "{{ home_dirs_to_fix }}"
      loop_control:
        label: "{{ item }}"
      register: home_dir_perms

    - name: "CIS 7.2.8 | Display changed home directories"
      ansible.builtin.debug:
        msg: "permissions updated : {{ item.item }}"
      loop: "{{ home_dir_perms.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.changed | default(false)