- name: Remove journal upload package and directory
  block:
    - name: Stop systemd-journal-upload service
      ansible.builtin.systemd:
        name: systemd-journal-upload.service
        state: stopped
        enabled: false
      register: journal_upload_service
      failed_when: false

    - name: Print service stop result
      ansible.builtin.debug:
        msg: "systemd-journal-upload.service - stopped: {{ journal_upload_service.status.ActiveState | default('unknown') }}, enabled: {{ journal_upload_service.status.UnitFileState | default('unknown') }}"

    - name: Remove systemd-journal-remote package
      ansible.builtin.dnf:
        name: systemd-journal-remote
        state: absent
      register: journal_pkg_remove

    - name: Print package removal result
      ansible.builtin.debug:
        msg: "systemd-journal-remote package removal - changed: {{ journal_pkg_remove.changed }}"

    - name: Remove journal-upload directory if it exists
      ansible.builtin.file:
        path: /var/lib/private/systemd/journal-upload
        state: absent
      register: journal_dir_remove

    - name: Print directory removal result
      ansible.builtin.debug:
        msg: "journal-upload directory removal - changed: {{ journal_dir_remove.changed }}"

    - name: Summary report
      ansible.builtin.debug:
        msg: |
          === systemd-journal-upload Cleanup Summary ===
          Host     : {{ inventory_hostname }}
          Service  : stopped={{ journal_upload_service.changed }}, state={{ journal_upload_service.status.ActiveState | default('unknown') }}
          Package  : removed={{ journal_pkg_remove.changed }}
          Directory: removed={{ journal_dir_remove.changed }}



- name: Check INACTIVE setting in /etc/default/useradd
  become: true
  block:
    - name: Check INACTIVE setting
      ansible.builtin.command:
        argv:
          - /bin/grep
          - -nE
          - '^[[:space:]]*INACTIVE[[:space:]]*='
          - /etc/default/useradd
      register: useradd_inactive
      changed_when: false
      failed_when: useradd_inactive.rc not in [0, 1]

    - name: Display INACTIVE setting
      ansible.builtin.debug:
        msg: "{{ useradd_inactive.stdout_lines if useradd_inactive.rc == 0 else 'INACTIVE setting not found' }}"

    - name: Print full useradd_inactive output
      ansible.builtin.debug:
        var: useradd_inactive

    - name: Read /etc/default/useradd content
      ansible.builtin.slurp:
        src: /etc/default/useradd
      register: useradd_file

    - name: Print /etc/default/useradd content
      ansible.builtin.debug:
        msg: "{{ useradd_file.content | b64decode }}"

- name: Set INACTIVE=30 in /etc/default/useradd
  become: true
  block:
    - name: Update INACTIVE setting to 30 days
      ansible.builtin.lineinfile:
        path: /etc/default/useradd
        regexp: '^[[:space:]]*INACTIVE[[:space:]]*='
        line: 'INACTIVE=30'
        state: present
      register: useradd_inactive_update

    - name: Print INACTIVE update result
      ansible.builtin.debug:
        msg: "INACTIVE setting updated: changed={{ useradd_inactive_update.changed }}"




- name: Clean comments and trailing whitespace from useradd defaults
  block:
    - name: Check for comments in /etc/default/useradd
      ansible.builtin.command:
        argv:
          - /bin/grep
          - -cE
          - '^[ \t]*#'
          - /etc/default/useradd
      register: useradd_comment_check
      changed_when: false
      failed_when: useradd_comment_check.rc not in [0, 1]

    - name: Print comment check result
      ansible.builtin.debug:
        msg: "Comments found in /etc/default/useradd: {{ 'yes' if useradd_comment_check.rc == 0 else 'no' }} ({{ useradd_comment_check.stdout }} line(s))"

    - name: Remove full-line comments
      ansible.builtin.lineinfile:
        path: /etc/default/useradd
        regexp: '^[ \t]*#.*$'
        state: absent
        backup: true
      register: useradd_comments_removed

    - name: Print full-line comments removal result
      ansible.builtin.debug:
        msg: "Full-line comments removed from /etc/default/useradd: {{ useradd_comments_removed.changed }}"

    - name: Remove trailing spaces and tabs
      ansible.builtin.replace:
        path: /etc/default/useradd
        regexp: '[ \t]+$'
        replace: ''
        backup: true
      register: useradd_trailing_removed

    - name: Print trailing whitespace removal result
      ansible.builtin.debug:
        msg: "Trailing spaces/tabs removed from /etc/default/useradd: {{ useradd_trailing_removed.changed }}"

- name: Remove primary interface from firewalld trusted zone if present
  become: true
  block:
    - name: Set primary network interface fact
      ansible.builtin.set_fact:
        primary_iface: "{{ ansible_default_ipv4.interface }}"

    - name: Print detected primary interface
      ansible.builtin.debug:
        msg: "Detected primary network interface: {{ primary_iface }}"

    - name: Check if primary interface is in the trusted zone
      ansible.builtin.command:
        cmd: firewall-cmd --zone=trusted --query-interface={{ primary_iface }}
      register: eth0_trusted_check
      changed_when: false
      failed_when: eth0_trusted_check.rc not in [0, 1]

    - name: Print primary interface trusted zone check result
      ansible.builtin.debug:
        msg: "{{ primary_iface }} is {{ 'in' if eth0_trusted_check.rc == 0 else 'not in' }} the trusted zone"

    - name: Remove primary interface from trusted zone
      ansible.builtin.shell: |
        firewall-cmd --zone=trusted --remove-interface={{ primary_iface }} --permanent
        firewall-cmd --reload
      when: eth0_trusted_check.rc == 0
      register: eth0_trusted_remove

    - name: Print primary interface removal result
      ansible.builtin.debug:
        msg: "{{ primary_iface }} removed from trusted zone: rc={{ eth0_trusted_remove.rc }}, stdout={{ eth0_trusted_remove.stdout }}"
      when: eth0_trusted_check.rc == 0

- name: Ensure firewalld loopback traffic is configured
  become: true
  block:
    - name: Check if lo interface is in the trusted zone
      ansible.builtin.command:
        cmd: firewall-cmd --zone=trusted --query-interface=lo
      register: lo_trusted_check
      changed_when: false
      failed_when: lo_trusted_check.rc not in [0, 1]

    - name: Print lo trusted zone check result
      ansible.builtin.debug:
        msg: "lo interface is {{ 'already in' if lo_trusted_check.rc == 0 else 'not in' }} the trusted zone"

    - name: Add lo interface to trusted zone
      ansible.builtin.shell: |
        firewall-cmd --zone=trusted --add-interface=lo --permanent
        firewall-cmd --reload
      when: lo_trusted_check.rc != 0
      register: lo_trusted_add

    - name: Print lo trusted zone add result
      ansible.builtin.debug:
        msg: "lo added to trusted zone: rc={{ lo_trusted_add.rc }}, stdout={{ lo_trusted_add.stdout }}"
      when: lo_trusted_check.rc != 0

    - name: Check rich rule for IPv4 loopback drop
      ansible.builtin.command:
        cmd: firewall-cmd --zone=public --list-rich-rules
      register: fw_rich_rules
      changed_when: false

    - name: Print existing rich rules
      ansible.builtin.debug:
        msg: "Current public zone rich rules: {{ fw_rich_rules.stdout_lines }}"

    - name: Add rich rule to drop IPv4 loopback spoofing
      ansible.builtin.shell: >
        firewall-cmd --permanent --zone=public
        --add-rich-rule='rule family=ipv4 source address="127.0.0.0/8" destination not address="127.0.0.0/8" drop'
      when: "'127.0.0.0/8' not in fw_rich_rules.stdout"
      register: fw_ipv4_rule

    - name: Print IPv4 loopback rule result
      ansible.builtin.debug:
        msg: "IPv4 loopback drop rule added: rc={{ fw_ipv4_rule.rc }}, stdout={{ fw_ipv4_rule.stdout }}"
      when: "'127.0.0.0/8' not in fw_rich_rules.stdout"

    - name: Add rich rule to drop IPv6 loopback spoofing
      ansible.builtin.shell: >
        firewall-cmd --permanent --zone=public
        --add-rich-rule='rule family=ipv6 source address="::1" destination not address="::1" drop'
      when: "'::1' not in fw_rich_rules.stdout"
      register: fw_ipv6_rule

    - name: Print IPv6 loopback rule result
      ansible.builtin.debug:
        msg: "IPv6 loopback drop rule added: rc={{ fw_ipv6_rule.rc }}, stdout={{ fw_ipv6_rule.stdout }}"
      when: "'::1' not in fw_rich_rules.stdout"

    - name: Reload firewalld to apply permanent rules
      ansible.builtin.shell: firewall-cmd --reload
      register: fw_reload

    - name: Print firewalld reload result
      ansible.builtin.debug:
        msg: "firewalld reloaded: rc={{ fw_reload.rc }}, stdout={{ fw_reload.stdout }}"

    - name: Verify final loopback configuration
      ansible.builtin.command:
        cmd: firewall-cmd --zone=trusted --list-interfaces
      register: fw_trusted_interfaces
      changed_when: false

    - name: Print final loopback configuration
      ansible.builtin.debug:
        msg: "Trusted zone interfaces: {{ fw_trusted_interfaces.stdout }}"

- name: Ensure loopback source addresses are assigned to trusted zone
  become: true
  block:
    - name: Check if 127.0.0.1/8 source is in trusted zone
      ansible.builtin.command:
        cmd: firewall-cmd --zone=trusted --query-source=127.0.0.1/8
      register: lo_ipv4_source_check
      changed_when: false
      failed_when: lo_ipv4_source_check.rc not in [0, 1]

    - name: Print IPv4 loopback source check
      ansible.builtin.debug:
        msg: "127.0.0.1/8 source is {{ 'already in' if lo_ipv4_source_check.rc == 0 else 'not in' }} trusted zone"

    - name: Add 127.0.0.1/8 source to trusted zone
      ansible.builtin.shell: |
        firewall-cmd --permanent --zone=trusted --add-source=127.0.0.1/8
        firewall-cmd --reload
      when: lo_ipv4_source_check.rc != 0
      register: lo_ipv4_source_add

    - name: Print IPv4 loopback source add result
      ansible.builtin.debug:
        msg: "127.0.0.1/8 added to trusted zone: rc={{ lo_ipv4_source_add.rc }}, stdout={{ lo_ipv4_source_add.stdout }}"
      when: lo_ipv4_source_check.rc != 0

    - name: Check if ::1 source is in trusted zone
      ansible.builtin.command:
        cmd: firewall-cmd --zone=trusted --query-source=::1
      register: lo_ipv6_source_check
      changed_when: false
      failed_when: lo_ipv6_source_check.rc not in [0, 1]

    - name: Print IPv6 loopback source check
      ansible.builtin.debug:
        msg: "::1 source is {{ 'already in' if lo_ipv6_source_check.rc == 0 else 'not in' }} trusted zone"

    - name: Add ::1 source to trusted zone
      ansible.builtin.shell: |
        firewall-cmd --permanent --zone=trusted --add-source=::1
        firewall-cmd --reload
      when: lo_ipv6_source_check.rc != 0
      register: lo_ipv6_source_add

    - name: Print IPv6 loopback source add result
      ansible.builtin.debug:
        msg: "::1 added to trusted zone: rc={{ lo_ipv6_source_add.rc }}, stdout={{ lo_ipv6_source_add.stdout }}"
      when: lo_ipv6_source_check.rc != 0

    - name: Verify trusted zone sources
      ansible.builtin.command:
        cmd: firewall-cmd --zone=trusted --list-sources
      register: fw_trusted_sources
      changed_when: false

    - name: Print trusted zone sources
      ansible.builtin.debug:
        msg: "Trusted zone sources: {{ fw_trusted_sources.stdout }}"

- name: Ensure firewalld is installed and service is configured
  become: true
  block:
    - name: Ensure firewalld package is installed
      ansible.builtin.dnf:
        name: firewalld
        state: present
      register: firewalld_pkg

    - name: Print firewalld package install result
      ansible.builtin.debug:
        msg: "firewalld package installed: changed={{ firewalld_pkg.changed }}"

    - name: Ensure firewalld.service is enabled and running
      ansible.builtin.systemd:
        name: firewalld.service
        state: started
        enabled: true
      register: firewalld_service

    - name: Print firewalld service status
      ansible.builtin.debug:
        msg: "firewalld.service - started={{ firewalld_service.status.ActiveState | default('unknown') }}, enabled={{ firewalld_service.status.UnitFileState | default('unknown') }}, changed={{ firewalld_service.changed }}"

    - name: Verify firewalld is active and running
      ansible.builtin.command:
        cmd: firewall-cmd --state
      register: fw_state
      changed_when: false

    - name: Print firewalld state
      ansible.builtin.debug:
        msg: "firewalld state: {{ fw_state.stdout }}"

- name: Ensure firewalld zones are configured 
  become: true
  block:
    - name: Get current default zone
      ansible.builtin.command:
        cmd: firewall-cmd --get-default-zone
      register: fw_default_zone
      changed_when: false

    - name: Print current default zone
      ansible.builtin.debug:
        msg: "Current firewalld default zone: {{ fw_default_zone.stdout }}"

    - name: Set default zone to public
      ansible.builtin.command:
        cmd: firewall-cmd --set-default-zone=public
      when: fw_default_zone.stdout != 'public'
      register: fw_set_zone

    - name: Print default zone set result
      ansible.builtin.debug:
        msg: "Default zone set to public: changed={{ fw_set_zone.changed }}"
      when: fw_default_zone.stdout != 'public'

    - name: Assign lo interface to trusted zone
      ansible.builtin.shell: |
        firewall-cmd --permanent --zone=trusted --add-interface=lo
        firewall-cmd --reload
      register: lo_zone_assign
      failed_when: lo_zone_assign.rc not in [0, 1]

    - name: Print lo trusted zone assignment result
      ansible.builtin.debug:
        msg: "lo → trusted zone: rc={{ lo_zone_assign.rc }}, stdout={{ lo_zone_assign.stdout }}"

    - name: Set primary network interface fact
      ansible.builtin.set_fact:
        primary_iface: "{{ ansible_default_ipv4.interface }}"

    - name: Print primary interface fact
      ansible.builtin.debug:
        msg: "Primary network interface: {{ primary_iface }}"

    - name: Check if primary interface is in trusted zone
      ansible.builtin.command:
        cmd: firewall-cmd --zone=trusted --query-interface={{ primary_iface }}
      register: primary_iface_trusted_check
      changed_when: false
      failed_when: primary_iface_trusted_check.rc not in [0, 1]

    - name: Print primary interface trusted zone check
      ansible.builtin.debug:
        msg: "{{ primary_iface }} is {{ 'in' if primary_iface_trusted_check.rc == 0 else 'not in' }} the trusted zone"

    - name: Remove primary interface from trusted zone
      ansible.builtin.shell: |
        firewall-cmd --permanent --zone=trusted --remove-interface={{ primary_iface }}
        firewall-cmd --reload
      when: primary_iface_trusted_check.rc == 0
      register: primary_iface_trusted_remove

    - name: Print primary interface trusted zone removal result
      ansible.builtin.debug:
        msg: "{{ primary_iface }} removed from trusted zone: rc={{ primary_iface_trusted_remove.rc }}, stdout={{ primary_iface_trusted_remove.stdout }}"
      when: primary_iface_trusted_check.rc == 0

    - name: Assign primary interface to public zone
      ansible.builtin.shell: |
        firewall-cmd --permanent --zone=public --add-interface={{ primary_iface }}
        firewall-cmd --reload
      register: eth0_zone_assign
      failed_when: eth0_zone_assign.rc not in [0, 1]

    - name: Print primary interface public zone assignment result
      ansible.builtin.debug:
        msg: "{{ primary_iface }} → public zone: rc={{ eth0_zone_assign.rc }}, stdout={{ eth0_zone_assign.stdout }}"

    - name: Verify interface zone assignments
      ansible.builtin.command:
        cmd: firewall-cmd --get-active-zones
      register: fw_active_zones
      changed_when: false

    - name: Print active zone assignments
      ansible.builtin.debug:
        msg: "Active firewalld zones:\n{{ fw_active_zones.stdout }}"




