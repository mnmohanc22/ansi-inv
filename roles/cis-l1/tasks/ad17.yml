- name: Remove journal upload package and directory
  block:
    - name: Stop systemd-journal-upload service
      ansible.builtin.systemd:
        name: systemd-journal-upload.service
        state: stopped
        enabled: false
      register: journal_upload_service
      failed_when: false

    - name: Print service stop result
      ansible.builtin.debug:
        msg: "systemd-journal-upload.service - stopped: {{ journal_upload_service.status.ActiveState | default('unknown') }}, enabled: {{ journal_upload_service.status.UnitFileState | default('unknown') }}"

    - name: Remove systemd-journal-remote package
      ansible.builtin.dnf:
        name: systemd-journal-remote
        state: absent
      register: journal_pkg_remove

    - name: Print package removal result
      ansible.builtin.debug:
        msg: "systemd-journal-remote package removal - changed: {{ journal_pkg_remove.changed }}"

    - name: Remove journal-upload directory if it exists
      ansible.builtin.file:
        path: /var/lib/private/systemd/journal-upload
        state: absent
      register: journal_dir_remove

    - name: Print directory removal result
      ansible.builtin.debug:
        msg: "journal-upload directory removal - changed: {{ journal_dir_remove.changed }}"

    - name: Summary report
      ansible.builtin.debug:
        msg: |
          === systemd-journal-upload Cleanup Summary ===
          Host     : {{ inventory_hostname }}
          Service  : stopped={{ journal_upload_service.changed }}, state={{ journal_upload_service.status.ActiveState | default('unknown') }}
          Package  : removed={{ journal_pkg_remove.changed }}
          Directory: removed={{ journal_dir_remove.changed }}



- name: Check INACTIVE setting in /etc/default/useradd
  become: true
  block:
    - name: Check INACTIVE setting
      ansible.builtin.command:
        argv:
          - /bin/grep
          - -nE
          - '^[[:space:]]*INACTIVE[[:space:]]*='
          - /etc/default/useradd
      register: useradd_inactive
      changed_when: false
      failed_when: useradd_inactive.rc not in [0, 1]

    - name: Display INACTIVE setting
      ansible.builtin.debug:
        msg: "{{ useradd_inactive.stdout_lines if useradd_inactive.rc == 0 else 'INACTIVE setting not found' }}"

    - name: Print full useradd_inactive output
      ansible.builtin.debug:
        var: useradd_inactive

    - name: Read /etc/default/useradd content
      ansible.builtin.slurp:
        src: /etc/default/useradd
      register: useradd_file

    - name: Print /etc/default/useradd content
      ansible.builtin.debug:
        msg: "{{ useradd_file.content | b64decode }}"

- name: Set INACTIVE=30 in /etc/default/useradd
  become: true
  block:
    - name: Update INACTIVE setting to 30 days
      ansible.builtin.lineinfile:
        path: /etc/default/useradd
        regexp: '^[[:space:]]*INACTIVE[[:space:]]*='
        line: 'INACTIVE=30'
        state: present
      register: useradd_inactive_update

    - name: Print INACTIVE update result
      ansible.builtin.debug:
        msg: "INACTIVE setting updated: changed={{ useradd_inactive_update.changed }}"




- name: Clean comments and trailing whitespace from useradd defaults
  block:
    - name: Check for comments in /etc/default/useradd
      ansible.builtin.command:
        argv:
          - /bin/grep
          - -cE
          - '^[ \t]*#'
          - /etc/default/useradd
      register: useradd_comment_check
      changed_when: false
      failed_when: useradd_comment_check.rc not in [0, 1]

    - name: Print comment check result
      ansible.builtin.debug:
        msg: "Comments found in /etc/default/useradd: {{ 'yes' if useradd_comment_check.rc == 0 else 'no' }} ({{ useradd_comment_check.stdout }} line(s))"

    - name: Remove full-line comments
      ansible.builtin.lineinfile:
        path: /etc/default/useradd
        regexp: '^[ \t]*#.*$'
        state: absent
        backup: true
      register: useradd_comments_removed

    - name: Print full-line comments removal result
      ansible.builtin.debug:
        msg: "Full-line comments removed from /etc/default/useradd: {{ useradd_comments_removed.changed }}"

    - name: Remove trailing spaces and tabs
      ansible.builtin.replace:
        path: /etc/default/useradd
        regexp: '[ \t]+$'
        replace: ''
        backup: true
      register: useradd_trailing_removed

    - name: Print trailing whitespace removal result
      ansible.builtin.debug:
        msg: "Trailing spaces/tabs removed from /etc/default/useradd: {{ useradd_trailing_removed.changed }}"