- name: "CIS Firewall | Check installed firewall packages"
  block:
    - name: "CIS Firewall | Get installed firewall packages"
      ansible.builtin.shell: |
        echo "=== firewalld ==="
        rpm -q firewalld || true
        echo "=== nftables ==="
        rpm -q nftables || true
        echo "=== iptables-services ==="
        rpm -q iptables-services || true
      register: firewall_packages
      changed_when: false

    - name: "CIS Firewall | Display firewall packages"
      ansible.builtin.debug:
        var: firewall_packages.stdout_lines


- name: "CIS Firewall | Check firewall services"
  block:
    - name: "CIS Firewall | Get firewall service status"
      ansible.builtin.shell: |
        echo "=== firewalld ==="
        echo "Enabled: $(systemctl is-enabled firewalld 2>/dev/null || true)"
        echo "Active:  $(systemctl is-active firewalld 2>/dev/null || true)"
        echo "=== nftables ==="
        echo "Enabled: $(systemctl is-enabled nftables 2>/dev/null || true)"
        echo "Active:  $(systemctl is-active nftables 2>/dev/null || true)"
        echo "=== iptables ==="
        echo "Enabled: $(systemctl is-enabled iptables 2>/dev/null || true)"
        echo "Active:  $(systemctl is-active iptables 2>/dev/null || true)"
        echo "=== ip6tables ==="
        echo "Enabled: $(systemctl is-enabled ip6tables 2>/dev/null || true)"
        echo "Active:  $(systemctl is-active ip6tables 2>/dev/null || true)"
      register: firewall_services
      changed_when: false

    - name: "CIS Firewall | Display firewall service status"
      ansible.builtin.debug:
        var: firewall_services.stdout_lines


- name: "CIS Firewall | Display active firewall configuration"
  block:
    - name: "CIS Firewall | Get active firewall configuration"
      ansible.builtin.shell: |
        echo "=== Active zones ==="
        firewall-cmd --get-active-zones

        echo "=== Configuration ==="
        firewall-cmd --list-all-zones
      register: firewalld_config
      changed_when: false
      failed_when: false

    - name: "CIS Firewall | Display firewall configuration"
      ansible.builtin.debug:
        var: firewalld_config.stdout_lines




- name: "CIS 4.2.2 | Check loopback interface and firewall rules"
  block:
    - name: "CIS 4.2.2 | Get loopback interface info"
      ansible.builtin.command:
        cmd: ip addr show lo
      register: loopback_interface
      changed_when: false

    - name: "CIS 4.2.2 | Get firewalld loopback rules"
      ansible.builtin.shell: |
        echo "=== Active Zones ==="
        firewall-cmd --get-active-zones
        echo "=== Direct Rules ==="
        firewall-cmd --direct --get-all-rules 2>/dev/null || true
        echo "=== nftables effective rules ==="
        nft list ruleset | grep -E '127\.0\.0\.0/8|::1|iifname.*lo' || true
      register: loopback_firewall
      changed_when: false
      failed_when: false

    - name: "CIS 4.2.2 | Display loopback configuration"
      ansible.builtin.debug:
        msg:
          - "{{ loopback_interface.stdout_lines }}"
          - "{{ loopback_firewall.stdout_lines }}"



- name: "CIS | Check systemd service states"
  block:
    - name: "CIS | Check bluetooth related packages"
      ansible.builtin.command:
        cmd: rpm -q "{{ item }}"
      loop:
        - bluez
        - bluez-libs
      register: bt_packages
      changed_when: false
      failed_when: false

    - name: "CIS | Display bluetooth package status"
      ansible.builtin.debug:
        msg: "{{ item.item }} : {{ 'INSTALLED' if item.rc == 0 else 'NOT INSTALLED' }}"
      loop: "{{ bt_packages.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: "CIS | Get systemd service states"
      ansible.builtin.shell: |
        service="{{ item }}"
        echo "Service: $service"
        echo "Active:  $(systemctl is-active "$service" 2>/dev/null || true)"
        echo "Enabled: $(systemctl is-enabled "$service" 2>/dev/null || true)"
        echo "Loaded:  $(systemctl show "$service" -p LoadState --value 2>/dev/null || true)"
        echo "UnitFileState: $(systemctl show "$service" -p UnitFileState --value 2>/dev/null || true)"
      loop:
        - bluetooth.service
      register: systemd_service_status
      changed_when: false
      failed_when: false

    - name: "CIS | Display systemd service states"
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ systemd_service_status.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: "CIS | Stop and mask bluetooth.service"
      ansible.builtin.systemd:
        name: bluetooth.service
        state: stopped
        enabled: false
        masked: true
      when: >-
        systemd_service_status.results
        | selectattr('item', 'eq', 'bluetooth.service')
        | map(attribute='stdout')
        | first
        | regex_search('Active:\s+active') is not none
      failed_when: false


- name: "CIS | Remove bluetooth packages"
  block:
    - name: "CIS | Remove bluez and bluez-libs packages"
      ansible.builtin.dnf:
        name:
          - bluez
          - bluez-libs
        state: absent
      register: bt_remove

    - name: "CIS | Display bluetooth package removal status"
      ansible.builtin.debug:
        msg: "bluetooth packages remove status : {{ 'REMOVED' if bt_remove.changed else 'SKIPPED (not installed)' }}"



- name: "CIS 6.1.1 | Check AIDE package"
  block:
    - name: "CIS 6.1.1 | Get AIDE package status"
      ansible.builtin.command:
        cmd: rpm -q aide
      register: aide_package
      changed_when: false
      failed_when: false

    - name: "CIS 6.1.1 | Display AIDE package status"
      ansible.builtin.debug:
        msg: "{{ aide_package.stdout if aide_package.rc == 0 else 'AIDE is not installed' }}"

- name: "CIS 6.1.1 | Install and initialize AIDE"
  block:
    - name: "CIS 6.1.1 | Install AIDE package"
      ansible.builtin.dnf:
        name: aide
        state: present
       
    - name: "CIS 6.1.1 | Check AIDE database exists"
      ansible.builtin.stat:
        path: /var/lib/aide/aide.db.gz
      register: aide_db

    - name: "CIS 6.1.1 | Initialize AIDE database"
      ansible.builtin.command:
        cmd: /usr/sbin/aide --init
      when: not aide_db.stat.exists

    - name: "CIS 6.1.1 | Activate initialized AIDE database"
      ansible.builtin.command:
        cmd: mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
      when: not aide_db.stat.exists
  
- name: "CIS 6.1.2 | Configure AIDE check service"
  block:
    - name: "CIS 6.1.2 | Create aidecheck.service unit file"
      ansible.builtin.copy:
        dest: /etc/systemd/system/aidecheck.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=AIDE filesystem integrity check

          [Service]
          Type=oneshot
          ExecStart=/usr/sbin/aide --check

          [Install]
          WantedBy=multi-user.target
      register: aide_service

    - name: "CIS 6.1.2 | Reload systemd to pick up aidecheck.service"
      ansible.builtin.systemd:
        daemon_reload: true
      when: aide_service.changed

    - name: "CIS 6.1.2 | Ensure aidecheck service is disabled"
      ansible.builtin.systemd:
        name: aidecheck.service
        enabled: false



- name: "CIS 6.2.4.1 | Restrict log directories"
  block:
    - name: "CIS 6.2.4.1 | Set 0750 on log directories"
      ansible.builtin.file:
        path: "{{ item }}"
        mode: '0750'
        state: directory
      loop:
        - /var/log/amazon
        - /var/log/sa
      loop_control:
        label: "{{ item }}"
      failed_when: false

    - name: "CIS 6.2.4.1 | Find files inside restricted log directories"
      ansible.builtin.find:
        paths:
          - /var/log/amazon
          - /var/log/sa
        file_type: file
        recurse: true
      register: restricted_log_files

    - name: "CIS 6.2.4.1 | Set 0640 on files inside restricted log directories"
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: '0640'
      loop: "{{ restricted_log_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: "CIS 6.2.4.1 | Get updated permissions for dirs and files"
      ansible.builtin.shell: |
        stat -c "%a %n" "{{ item }}" 2>/dev/null || echo "{{ item }} : not found"
      loop:
        - /var/log/amazon
        - /var/log/sa
      register: log_dir_perms
      changed_when: false
      failed_when: false

    - name: "CIS 6.2.4.1 | Display updated log directory permissions"
      ansible.builtin.debug:
        msg: "{{ item.stdout }}"
      loop: "{{ log_dir_perms.results }}"
      loop_control:
        label: "{{ item.item }}"


- name: "CIS 6.2.4.1 | Check log directory permissions"
  block:
    - name: "CIS 6.2.4.1 | Get log directory permissions"
      ansible.builtin.shell: |
        stat -c '%a %U %G %n' "{{ item }}" 2>/dev/null || echo "{{ item }} : not found"
      loop:
        - /var/log/amazon
        - /var/log/sa
      register: log_dir_status
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item }}"

    - name: "CIS 6.2.4.1 | Display log directory permissions"
      ansible.builtin.debug:
        msg: "{{ item.stdout }}"
      loop: "{{ log_dir_status.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: "CIS 6.2.4.1 | Find files recursively in log directories"
      ansible.builtin.shell: |
        find "{{ item }}" -type f -printf '%m %u %g %p\n' 2>/dev/null || echo "{{ item }} : not found or empty"
      loop:
        - /var/log/amazon
        - /var/log/sa
      register: log_dir_files
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item }}"

    - name: "CIS 6.2.4.1 | Display file permissions inside log directories"
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ log_dir_files.results }}"
      loop_control:
        label: "{{ item.item }}"