---
# Section 5 | Access, Authentication and Authorization - Audit Checks
# CIS Red Hat Enterprise Linux 9 Benchmark v2.0.0 L1

# 5.1.1
- name: "Audit | 5.1.1 Ensure cron daemon is enabled and active"
  ansible.builtin.shell: |
    systemctl is-enabled crond 2>/dev/null | grep -q 'enabled' && \
    systemctl is-active crond 2>/dev/null | grep -q 'active' && \
    echo "PASS" || echo "FAIL"
  register: cis_5_1_1
  changed_when: false
  failed_when: false

- name: "Audit | 5.1.1 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '5.1.1', 'title': 'Ensure cron daemon is enabled and active', 'status': 'PASS' if 'PASS' in cis_5_1_1.stdout else 'FAIL'}] }}"

# 5.1.2
- name: "Audit | 5.1.2 Ensure permissions on /etc/crontab are configured"
  ansible.builtin.shell: |
    stat -c "%a %u %g" /etc/crontab | grep -Pq '^\s*[0-7][06][06]\s+0\s+0\b' && echo "PASS" || echo "FAIL"
  register: cis_5_1_2
  changed_when: false
  failed_when: false

- name: "Audit | 5.1.2 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '5.1.2', 'title': 'Ensure permissions on /etc/crontab are configured', 'status': 'PASS' if 'PASS' in cis_5_1_2.stdout else 'FAIL'}] }}"

# 5.1.8
- name: "Audit | 5.1.8 Ensure cron is restricted to authorized users"
  ansible.builtin.shell: |
    [ ! -f /etc/cron.deny ] && \
    stat -c "%a %u %g" /etc/cron.allow 2>/dev/null | grep -Pq '^\s*6[04][04]\s+0\s+0\b' && \
    echo "PASS" || echo "FAIL"
  register: cis_5_1_8
  changed_when: false
  failed_when: false

- name: "Audit | 5.1.8 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '5.1.8', 'title': 'Ensure cron is restricted to authorized users', 'status': 'PASS' if 'PASS' in cis_5_1_8.stdout else 'FAIL'}] }}"

