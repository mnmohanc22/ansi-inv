# 5.2.15
- name: "Audit | 5.2.15 Ensure SSH MaxAuthTries is set to 4 or less"
  ansible.builtin.shell: |
    val=$(sshd -T 2>/dev/null | grep -i maxauthtries | awk '{print $2}')
    [ -n "$val" ] && [ "$val" -le 4 ] && echo "PASS" || echo "FAIL"
  register: cis_5_2_15
  changed_when: false
  failed_when: false

- name: "Audit | 5.2.15 Set result"
  ansible.builtin.set_fact:
