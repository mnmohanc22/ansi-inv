# 5.2.11
- name: "Audit | 5.2.11 Ensure SSH IgnoreRhosts is enabled"
  ansible.builtin.shell: |
    sshd -T 2>/dev/null | grep -qi 'ignorerhosts yes' && echo "PASS" || echo "FAIL"
