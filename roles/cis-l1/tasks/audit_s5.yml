# 5.3.1 - PAM faillock
- name: "Audit | 5.3.1 Ensure password failed attempts lockout is configured"
  ansible.builtin.shell: |
    grep -Pqs '^\s*deny\s*=\s*[1-5]\b' /etc/security/faillock.conf && echo "PASS" || echo "FAIL"
  register: cis_5_3_1
  changed_when: false
  failed_when: false

- name: "Audit | 5.3.1 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '5.3.1', 'title': 'Ensure password failed attempts lockout is configured', 'status': 'PASS' if 'PASS' in cis_5_3_1.stdout else 'FAIL'}] }}"

# 5.4.1 - Password expiration
- name: "Audit | 5.4.1 Ensure password expiration is 365 days or less"
  ansible.builtin.shell: |
    val=$(grep -P '^\s*PASS_MAX_DAYS\s+\d+' /etc/login.defs | awk '{print $2}')
    [ -n "$val" ] && [ "$val" -le 365 ] && [ "$val" -gt 0 ] && echo "PASS" || echo "FAIL"
  register: cis_5_4_1
  changed_when: false
  failed_when: false

- name: "Audit | 5.4.1 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '5.4.1', 'title': 'Ensure password expiration is 365 days or less', 'status': 'PASS' if 'PASS' in cis_5_4_1.stdout else 'FAIL'}] }}"

# 5.4.2
- name: "Audit | 5.4.2 Ensure minimum days between password changes is configured"
  ansible.builtin.shell: |
    val=$(grep -P '^\s*PASS_MIN_DAYS\s+\d+' /etc/login.defs | awk '{print $2}')
    [ -n "$val" ] && [ "$val" -ge 1 ] && echo "PASS" || echo "FAIL"
  register: cis_5_4_2
  changed_when: false
  failed_when: false

- name: "Audit | 5.4.2 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '5.4.2', 'title': 'Ensure minimum days between password changes is configured', 'status': 'PASS' if 'PASS' in cis_5_4_2.stdout else 'FAIL'}] }}"

# 5.4.3
- name: "Audit | 5.4.3 Ensure password expiration warning days is 7 or more"
  ansible.builtin.shell: |
    val=$(grep -P '^\s*PASS_WARN_AGE\s+\d+' /etc/login.defs | awk '{print $2}')
    [ -n "$val" ] && [ "$val" -ge 7 ] && echo "PASS" || echo "FAIL"
  register: cis_5_4_3
  changed_when: false
  failed_when: false

- name: "Audit | 5.4.3 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '5.4.3', 'title': 'Ensure password expiration warning days is 7 or more', 'status': 'PASS' if 'PASS' in cis_5_4_3.stdout else 'FAIL'}] }}"

# 5.4.3.2 - shell timeout
- name: "Audit | 5.4.3.2 Ensure default user shell timeout is configured"
  ansible.builtin.shell: |
    grep -rPqs '^\s*TMOUT\s*=\s*(9[0-9][0-9]|[1-8][0-9]{2}|[1-9][0-9]|[1-9])\b' \
      /etc/profile /etc/profile.d/*.sh 2>/dev/null && echo "PASS" || echo "FAIL"
  register: cis_5_4_3_2
  changed_when: false
  failed_when: false

- name: "Audit | 5.4.3.2 Set result"
  ansible.builtin.set_fact:
    cis_audit_results: "{{ cis_audit_results + [{'id': '5.4.3.2', 'title': 'Ensure default user shell timeout is configured', 'status': 'PASS' if 'PASS' in cis_5_4_3_2.stdout else 'FAIL'}] }}"

- name: "Audit | Section 5 Summary Header"
  ansible.builtin.debug:
    msg:
      - "===== Section 5 | Access, Authentication and Authorization - Audit Summary ====="
      - "Total : {{ s5_results | length }}"
      - "PASS  : {{ s5_results | selectattr('status', 'eq', 'PASS') | list | length }}"
      - "FAIL  : {{ s5_results | selectattr('status', 'eq', 'FAIL') | list | length }}"
      - "-------------------------------------------------------"
  vars:
    s5_results: "{{ cis_audit_results | selectattr('id', 'match', '^5\\.') | list }}"

- name: "Audit | Section 5 Summary Items"
  ansible.builtin.debug:
    msg: "[{{ item.status }}]  {{ item.id }} - {{ item.title }}"
  loop: "{{ cis_audit_results | selectattr('id', 'match', '^5\\.') | list }}"
  loop_control:
    label: "{{ item.id }}"
