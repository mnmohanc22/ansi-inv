- name: "Audit | 5.2.18 Ensure SSH AllowTcpForwarding is disabled"
  ansible.builtin.shell: |
    sshd -T 2>/dev/null | grep -qi 'allowtcpforwarding no' && echo "PASS" || echo "FAIL"
  register: cis_5_2_18
