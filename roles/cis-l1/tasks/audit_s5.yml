# 5.2.5
- name: "Audit | 5.2.5 Ensure SSH LogLevel is configured"
  ansible.builtin.shell: |
    sshd -T -C user=root -C host="$(hostname)" -C addr="$(hostname -I | awk '{print $1}')" 2>/dev/null | \
    grep -Piq '^\s*loglevel\s+(VERBOSE|INFO)\b' && echo "PASS" || echo "FAIL"
  register: cis_5_2_5
  changed_when: false
  failed_when: false

- name: "Audit | 5.2.5 Set result"
  ansible.builtin.set_fact:
