- name: "Audit | 5.2.1 Ensure permissions on /etc/ssh/sshd_config are configured"
  ansible.builtin.shell: |
    stat -c "%a %u %g" /etc/ssh/sshd_config | grep -Pq '^\s*[0-7][06][06]\s+0\s+0\b' && echo "PASS" || echo "FAIL"
  register: cis_5_2_1
  changed_when: false
  failed_when: false

- name: "Audit | 5.2.1 Set result"
  ansible.builtin.set_fact:
