- name: "Copy CIS audit check scripts to work directory"
  become: true
  block:
    - name: "Create audit scripts directory"
      ansible.builtin.file:
        path: "{{ audit_work_dir }}/scripts"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: "Copy pre-extracted check scripts"
      ansible.builtin.copy:
        src: scripts/
        dest: "{{ audit_work_dir }}/scripts/"
        owner: root
        group: root
        mode: "0750"


- name: "Run CIS RHEL 9 audit checks"
  become: true
  block:
    - name: "Run all CIS audit check scripts"
      ansible.builtin.shell:
        cmd: "bash {{ audit_work_dir }}/scripts/{{ item.script }}"
      loop: "{{ cis_audit_checks }}"
      loop_control:
        label: "{{ item.cis_id }} {{ item.description }}"
      register: all_check_results
      changed_when: false
      failed_when: false

    - name: "Set PASS/FAIL flag for each audit item"
      ansible.builtin.set_fact:
        audit_results: >-
          {%- set ns = namespace(items=[]) -%}
          {%- for i in range(all_check_results.results | length) -%}
            {%- set r = all_check_results.results[i] -%}
            {%- set c = cis_audit_checks[i] -%}
            {%- set flag = 'PASS' if (r.stdout | default('') | regex_search('(?i)\\*+\\s*pass')) else 'FAIL' -%}
            {%- set _ = ns.items.append({
                'cis_id':      c.cis_id,
                'description': c.description,
                'result':      flag,
                'output':      r.stdout | default('') | truncate(800, True, '') | replace('\n', ' | ')
            }) -%}
          {%- endfor -%}
          {{ ns.items }}


    - name: "Display each audit item result"
      ansible.builtin.debug:
        msg: >-
          {%- set lines = [] -%}
          {%- for item in audit_results -%}
            {%- set _ = lines.append('[' ~ item.result ~ '] ' ~ item.cis_id ~ ' | ' ~ item.description) -%}
          {%- endfor -%}
          {{ lines }}

    - name: "Display audit summary"
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "  CIS RHEL 9 Audit Summary"
          - "============================================"
          - "  Host  : {{ inventory_hostname }}"
          - "  Total : {{ audit_results | length }}"
          - "  PASS  : {{ audit_results | selectattr('result', 'eq', 'PASS') | list | length }}"
          - "  FAIL  : {{ audit_results | selectattr('result', 'eq', 'FAIL') | list | length }}"
          - "============================================"

    - name: "Display failed checks"
      ansible.builtin.debug:
        msg: "[FAIL] {{ item.cis_id }} | {{ item.description }}"
      loop: "{{ audit_results | selectattr('result', 'eq', 'FAIL') | list }}"
      loop_control:
        label: "{{ item.cis_id }}"

    # - name: "Remove audit work directory"
    #   ansible.builtin.file:
    #     path: "{{ audit_work_dir }}"
    #     state: absent


- name: "Generate audit results CSV on remote host"
  become: true
  block:
    - name: "Create audit reports directory on managed host"
      ansible.builtin.file:
        path: "{{ audit_reports_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: "Generate audit results CSV in work directory"
      ansible.builtin.template:
        src: cis_audit_results.csv.j2
        dest: "{{ audit_csv_file }}"
        mode: "0640"

    - name: "Copy CSV to audit reports directory on managed host"
      ansible.builtin.copy:
        src: "{{ audit_csv_file }}"
        dest: "{{ audit_reports_dir }}/{{ inventory_hostname }}_cis_audit.csv"
        remote_src: true
        mode: "0640"

    - name: "Display remote CSV locations"
      ansible.builtin.debug:
        msg:
          - "Work dir CSV    : {{ audit_csv_file }}"
          - "Reports dir CSV : {{ audit_reports_dir }}/{{ inventory_hostname }}_cis_audit.csv"





