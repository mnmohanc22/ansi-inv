---
- name: Apply RHEL compliance checks
  hosts: rhel
  become: true
  roles:
    - cis-se
  post_tasks:
    - name: "Generate combined audit results CSV on Ansible controller"
      run_once: true
      delegate_to: localhost
      become: false
      block:
        - name: "Create reports directory on controller"
          ansible.builtin.file:
            path: "{{ audit_reports_controller_dir }}"
            state: directory
            mode: "0755"

        - name: "Write combined audit results CSV"
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/cis-se/templates/cis_audit_results_combined.csv.j2"
            dest: "{{ audit_reports_controller_dir }}/cis_audit_combined.csv"
            mode: "0640"

        - name: "Display combined CSV location"
          ansible.builtin.debug:
            msg: "Combined CSV : {{ audit_reports_controller_dir }}/cis_audit_combined.csv"